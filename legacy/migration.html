<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polylife — Migrazione Database</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&family=Rajdhani:wght@300;400;600&display=swap');

  :root {
    --bg: #08080f; --surface: #0f0f1a; --border: rgba(255,255,255,0.08);
    --accent: #7c6fe0; --accent2: #a78bfa; --teal: #2dd4bf;
    --green: #4ade80; --red: #ef4444; --amber: #fbbf24;
    --text: #e2e2ee; --muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden;
  }
  .wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 48px 56px; width: 560px; text-align: center;
  }
  .logo {
    font-family: 'Orbitron', monospace; font-size: 28px; font-weight: 900;
    color: var(--accent2); letter-spacing: 4px; margin-bottom: 8px;
  }
  .logo span { color: var(--teal); }
  .subtitle { font-size: 13px; color: var(--muted); font-family: 'Space Mono', monospace; margin-bottom: 40px; }
  h1 { font-family: 'Orbitron', monospace; font-size: 18px; font-weight: 700; margin-bottom: 12px; }
  .desc { font-size: 14px; color: var(--muted); line-height: 1.7; margin-bottom: 36px; }
  .progress-wrap { background: rgba(255,255,255,0.05); border-radius: 6px; height: 6px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--teal)); border-radius: 6px; width: 0%; transition: width 0.4s ease; }
  #migration-status {
    font-family: 'Space Mono', monospace; font-size: 13px;
    font-weight: 700; margin-bottom: 20px; min-height: 20px;
    color: var(--amber);
  }
  #migration-log {
    background: rgba(0,0,0,0.3); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px; text-align: left;
    font-family: 'Space Mono', monospace; font-size: 11px;
    color: var(--muted); max-height: 160px; overflow-y: auto;
    line-height: 1.8;
  }
  #migration-log div { border-bottom: 1px solid rgba(255,255,255,0.04); padding: 2px 0; }
  .spinner {
    width: 40px; height: 40px; border: 3px solid rgba(124,111,224,0.2);
    border-top-color: var(--accent2); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .done-icon { font-size: 48px; margin-bottom: 20px; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">POLY<span>LIFE</span></div>
  <div class="subtitle">v2.0 · Database Upgrade</div>
  <div class="done-icon" id="done-icon">✅</div>
  <div class="spinner" id="spinner"></div>
  <h1>Migrazione al Database SQLite</h1>
  <div class="desc">
    Stiamo trasferendo i tuoi dati da localStorage al nuovo database SQLite.<br>
    Questo avviene <strong>una sola volta</strong>. I dati originali non vengono eliminati.
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
  <div id="migration-status">Inizializzazione...</div>
  <div id="migration-log"></div>
</div>

<script src="migration.js"></script>
<script>
  // Aggiorna la progress bar man mano che arrivano log
  const observer = new MutationObserver(() => {
    const el = document.getElementById('migration-log');
    const lines = el.querySelectorAll('div').length;
    const bar = document.getElementById('progress-bar');
    bar.style.width = Math.min(lines * 10, 90) + '%';
  });
  observer.observe(document.getElementById('migration-log'), { childList: true });

  // Quando la migrazione finisce con successo
  window.__migrationDone = () => {
    document.getElementById('progress-bar').style.width = '100%';
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('done-icon').style.display = 'block';
    document.getElementById('migration-status').style.color = 'var(--green)';
    document.getElementById('migration-status').textContent = '✓ Migrazione completata con successo!';
  };
</script>
</body>
</html>
