<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>STUDIO // POLYMATH OS</title>
<link rel="manifest" href="manifest-studio.json">
<link rel="apple-touch-icon" href="icon-studio-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studio">
<meta name="theme-color" content="#060a0e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #060a0e;
  --bg2:      #0a1018;
  --bg3:      #0f1820;
  --bg4:      #162030;
  --border:   #1a2a38;
  --border2:  #203040;
  --text:     #e8eef5;
  --text2:    #8da0b3;
  --text3:    #3d5568;
  --cyan:     #00e5ff;
  --blue:     #4f8cff;
  --purple:   #a78bfa;
  --pink:     #ec4899;
  --gold:     #fbbf24;
  --green:    #10b981;
  --red:      #ef4444;
  --orange:   #f97316;
  /* Alias per compatibilità con JS */
  --purple-light: rgba(167,139,250,0.12);
  --purple-mid:   #7c68d0;
  --green-light:  rgba(16,185,129,0.12);
  --green-mid:    #0d9969;
  --amber:        #fbbf24;
  --amber-light:  rgba(251,191,36,0.1);
  --amber-mid:    #d4a017;
  --red-light:    rgba(239,68,68,0.1);
  --red-mid:      #c93232;
  --coral:        #f97316;
  --coral-light:  rgba(249,115,22,0.1);
  --coral-mid:    #d4621a;
  --blue-light:   rgba(79,140,255,0.12);
  --blue-mid:     #2d69d4;
  --teal:         #00e5ff;
  --teal-light:   rgba(0,229,255,0.08);
  --teal-mid:     #00b8cc;
  --paper:        #0a1018;
  --rule:         #1a2a38;
  --r-sm:4px; --r-md:6px; --r-lg:8px; --r-xl:12px;
  --shadow-sm: 0 1px 8px rgba(0,0,0,0.4);
  --shadow-md: 0 4px 20px rgba(0,0,0,0.5);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}

body {
  background-image:
    radial-gradient(ellipse 100% 60% at 15% -10%, rgba(79,140,255,0.06) 0%, transparent 55%),
    radial-gradient(ellipse 70% 50% at 85% 110%, rgba(167,139,250,0.05) 0%, transparent 55%);
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,229,255,0.006) 2px, rgba(0,229,255,0.006) 3px),
    repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,229,255,0.003) 40px, rgba(0,229,255,0.003) 41px);
  pointer-events: none;
  z-index: 0;
}

.app { max-width: 420px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; position: relative; z-index: 1; }
.content { flex: 1; overflow-y: auto; padding-bottom: 84px; }
.screen { display: none; }
.screen.active { display: block; }
.ph { padding: 1rem 1rem 0; }

/* ── NAV ── */
.nav-bottom {
  display: flex;
  background: var(--bg2);
  border-top: 1px solid var(--border2);
  border-top-color: var(--blue);
  padding: 6px 0 max(6px, env(safe-area-inset-bottom));
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 420px;
  z-index: 100;
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 5px 2px; cursor: pointer; border: none; background: none;
  color: var(--text3); font-size: 8px;
  font-family: 'Orbitron', monospace;
  letter-spacing: 0.06em; text-transform: uppercase;
  border-top: 2px solid transparent; transition: all .15s; position: relative;
}
.nav-btn.active { color: var(--blue); border-top-color: var(--blue); }
.nav-icon { font-size: 16px; line-height: 1; }

/* ── TYPOGRAPHY ── */
.page-title {
  font-family: 'Orbitron', monospace;
  font-size: 18px; font-weight: 900;
  color: var(--text); letter-spacing: 0.06em;
  line-height: 1; text-transform: uppercase;
}
.page-title span { color: var(--blue); text-shadow: 0 0 16px rgba(79,140,255,0.5); }
.page-sub { font-size: 9px; color: var(--text3); margin-bottom: 1.25rem; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px; }
.sec-label {
  font-family: 'Orbitron', monospace;
  font-size: 8px; font-weight: 700; color: var(--text3);
  letter-spacing: 0.25em; text-transform: uppercase; margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.sec-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.divider { height: 1px; background: var(--border); margin: 1rem 0; }

.page-header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border2);
  border-bottom-color: var(--blue);
  padding: 1.25rem 1rem .85rem;
  position: relative; overflow: hidden;
}
.page-header::before {
  content: '';
  position: absolute; bottom: 0; right: 0;
  width: 120px; height: 120px;
  background: radial-gradient(circle, rgba(79,140,255,0.06), transparent 70%);
  pointer-events: none;
}
.page-header::after {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--blue), transparent);
  pointer-events: none;
}

/* ── STREAK ── */
.streak-row { display: flex; gap: 4px; margin-bottom: 1.25rem; }
.s-day {
  flex: 1; height: 44px;
  border: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 8px; color: var(--text3); gap: 2px;
  font-family: 'Orbitron', monospace; letter-spacing: 0.05em;
  transition: all .2s;
}
.s-day.ok { border-color: var(--green); color: var(--green); background: rgba(16,185,129,0.06); }
.s-day.td { border-color: var(--blue); border-width: 2px; color: var(--blue); box-shadow: 0 0 10px rgba(79,140,255,0.2); }
.s-day .sn { font-size: 15px; font-weight: 700; line-height: 1; font-family: 'Orbitron', monospace; }

/* ── CHIPS ── */
.subj-chip {
  display: inline-block; padding: 4px 10px;
  font-size: 10px; color: var(--text2);
  border: 1px solid var(--border2); margin: 2px;
  font-family: 'Orbitron', monospace; letter-spacing: 0.06em;
  text-transform: uppercase;
  background: rgba(79,140,255,0.05);
}

/* ── CARDS ── */
.card {
  background: var(--bg2);
  border: 1px solid var(--border2);
  padding: .85rem 1rem; margin-bottom: 8px;
  position: relative; overflow: hidden;
}
.card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--border2); }
.card.hi::before  { background: var(--red); box-shadow: 0 0 8px rgba(239,68,68,0.4); }
.card.md::before  { background: var(--gold); box-shadow: 0 0 8px rgba(251,191,36,0.3); }
.card.lo::before  { background: var(--green); box-shadow: 0 0 8px rgba(16,185,129,0.3); }
.card.obbl::before{ background: var(--red); box-shadow: 0 0 8px rgba(239,68,68,0.5); }
.card.obbl        { background: rgba(239,68,68,0.06); border-color: rgba(239,68,68,0.2); }
.card.done-c      { opacity: .35; }
.card-meta { display: flex; gap: 4px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
.badge {
  font-size: 8px; padding: 2px 7px;
  font-family: 'Orbitron', monospace; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; border: 1px solid;
}
.bhi   { background: rgba(239,68,68,0.1);   color: var(--red);    border-color: rgba(239,68,68,0.3);   }
.bmd   { background: rgba(251,191,36,0.1);  color: var(--gold);   border-color: rgba(251,191,36,0.3);  }
.blo   { background: rgba(16,185,129,0.1);  color: var(--green);  border-color: rgba(16,185,129,0.3);  }
.bobbl { background: rgba(239,68,68,0.1);   color: var(--red);    border-color: rgba(239,68,68,0.3);   }
.btype { background: var(--bg3); color: var(--text3); border-color: var(--border); }
.btime { background: var(--bg3); color: var(--text3); border-color: var(--border); }
.bver  { background: rgba(79,140,255,0.1);  color: var(--blue);   border-color: rgba(79,140,255,0.3);  }
.bai   { background: rgba(0,229,255,0.08);  color: var(--cyan);   border-color: rgba(0,229,255,0.2);   }
.card-title { font-family: 'Orbitron', monospace; font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 3px; letter-spacing: 0.04em; text-transform: uppercase; }
.card-sub { font-size: 11px; color: var(--text2); }
.card-btns { display: flex; gap: 6px; margin-top: 10px; }
.card-btns button {
  flex: 1; padding: 8px;
  font-size: 9px; cursor: pointer;
  border: 1px solid var(--border2);
  background: transparent; color: var(--text);
  font-family: 'Orbitron', monospace; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  transition: all .15s;
}
.card-btns button:active { opacity: .7; }
.btn-go  { background: var(--blue)!important;   color: var(--bg)!important;   border-color: var(--blue)!important;   box-shadow: 0 0 12px rgba(79,140,255,0.3)!important; }
.btn-ok  { background: rgba(16,185,129,0.1)!important; color: var(--green)!important; border-color: rgba(16,185,129,0.4)!important; }
.btn-rec { background: var(--bg3)!important; color: var(--text2)!important; }

/* ── BUTTONS ── */
.btn-main {
  width: 100%; padding: 13px;
  border: 1px solid var(--blue);
  background: rgba(79,140,255,0.1);
  color: var(--blue);
  font-size: 9px; font-weight: 700; cursor: pointer;
  font-family: 'Orbitron', monospace; letter-spacing: 0.15em; text-transform: uppercase;
  transition: all .15s; margin-bottom: 8px;
  box-shadow: 0 0 16px rgba(79,140,255,0.15);
}
.btn-main:active, .btn-main:hover { background: var(--blue); color: var(--bg); box-shadow: 0 0 24px rgba(79,140,255,0.4); }
.btn-sec {
  width: 100%; padding: 11px;
  border: 1px solid var(--border2);
  background: transparent;
  font-size: 9px; color: var(--text3); cursor: pointer;
  font-family: 'Orbitron', monospace; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px;
  transition: all .15s;
}
.btn-sec:hover { border-color: var(--text3); color: var(--text2); }
.btn-danger {
  width: 100%; padding: 11px;
  border: 1px solid rgba(239,68,68,0.3);
  background: rgba(239,68,68,0.06);
  font-size: 9px; color: var(--red); cursor: pointer;
  font-family: 'Orbitron', monospace; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px;
  transition: all .15s;
}
.btn-danger:hover { background: rgba(239,68,68,0.12); }

/* ── FORM ── */
.form-sec {
  background: var(--bg2);
  border: 1px solid var(--border2);
  padding: 1rem; margin-bottom: 1rem;
}
input, select, textarea {
  width: 100%;
  border: 1px solid var(--border);
  padding: 9px 11px;
  font-size: 12px;
  font-family: 'Space Mono', monospace;
  color: var(--text); background: var(--bg);
  margin-bottom: 8px; outline: none;
  transition: border .15s;
  -webkit-appearance: none;
  border-radius: 0;
}
input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 8px rgba(79,140,255,0.15); }
textarea { resize: none; min-height: 70px; line-height: 1.6; }
.field-row { display: flex; gap: 8px; }
.field-row > * { flex: 1; }
label { font-size: 9px; font-weight: 700; color: var(--text3); display: block; margin-bottom: 4px; font-family: 'Orbitron', monospace; letter-spacing: 0.15em; text-transform: uppercase; }

/* ── FOCUS MODE ── */
.focus-box {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-top: 2px solid var(--blue);
  padding: 1.75rem 1.5rem;
  text-align: center; margin-bottom: 1rem;
  position: relative; overflow: hidden;
}
.focus-box::before {
  content: '';
  position: absolute; top: -30px; right: -30px;
  width: 120px; height: 120px;
  background: radial-gradient(circle, rgba(79,140,255,0.06), transparent 70%);
  pointer-events: none;
}
.focus-subj {
  font-family: 'Orbitron', monospace; font-size: 8px; color: var(--blue);
  margin-bottom: 5px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
}
.focus-title {
  font-family: 'Orbitron', monospace; font-size: 14px; font-weight: 700;
  color: var(--text); margin-bottom: .5rem; letter-spacing: 0.04em;
}
.focus-detail { font-size: 11px; color: var(--text2); margin-bottom: 1.5rem; }
.timer-big {
  font-family: 'Orbitron', monospace; font-size: 54px; font-weight: 900;
  color: var(--cyan); letter-spacing: 0.04em;
  margin-bottom: .2rem; line-height: 1;
  text-shadow: 0 0 30px rgba(0,229,255,0.4);
}
.timer-st { font-size: 10px; color: var(--text3); margin-bottom: 1.5rem; letter-spacing: 0.1em; }
.t-controls { display: flex; gap: 8px; justify-content: center; }
.t-controls button {
  padding: 10px 16px;
  font-size: 9px; cursor: pointer;
  border: 1px solid var(--border2);
  background: transparent; color: var(--text);
  font-family: 'Orbitron', monospace; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  transition: all .15s;
}
.t-controls button:active { opacity: .7; }
.t-play { background: var(--cyan)!important; color: var(--bg)!important; border-color: var(--cyan)!important; box-shadow: 0 0 16px rgba(0,229,255,0.35)!important; }
.prog { height: 3px; background: var(--border); margin-bottom: 1.75rem; overflow: hidden; }
.prog-f { height: 100%; background: linear-gradient(90deg, var(--blue), var(--cyan)); transition: width .8s linear; }

/* ── VERIFICHE ── */
.ver-card {
  background: var(--bg2); border: 1px solid var(--border);
  padding: .85rem 1rem; margin-bottom: 8px;
  display: flex; align-items: center; gap: 10px;
}
.ver-card.urgent { border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.05); }
.ver-card.soon   { border-color: rgba(251,191,36,0.4); background: rgba(251,191,36,0.04); }
.ver-date-box { padding: 7px 10px; text-align: center; min-width: 46px; border: 1px solid var(--border); }
.ver-day-n { font-family: 'Orbitron', monospace; font-size: 20px; font-weight: 900; line-height: 1; }
.ver-mon   { font-family: 'Orbitron', monospace; font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2px; }
.ver-info  { flex: 1; }
.ver-title { font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 700; color: var(--text); letter-spacing: 0.06em; text-transform: uppercase; }

/* ── NOTE ── */
.note-card {
  background: var(--bg2); border: 1px solid var(--border);
  padding: .9rem 1rem; margin-bottom: 8px; position: relative;
  border-left: 3px solid var(--purple);
}
.note-date  { font-size: 10px; color: var(--text3); margin-bottom: 4px; font-family: 'Orbitron', monospace; letter-spacing: 0.08em; }
.note-subj  { font-family: 'Orbitron', monospace; font-size: 10px; font-weight: 700; color: var(--purple); letter-spacing: 0.1em; text-transform: uppercase; }
.note-text  { font-size: 12px; color: var(--text2); line-height: 1.7; }
.note-ai-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 12px;
  background: rgba(0,229,255,0.06); color: var(--cyan);
  font-size: 9px; font-weight: 700; cursor: pointer;
  font-family: 'Orbitron', monospace; letter-spacing: 0.1em; text-transform: uppercase;
  border: 1px solid rgba(0,229,255,0.2);
  transition: all .15s;
}
.note-ai-btn:hover { background: rgba(0,229,255,0.12); border-color: var(--cyan); }

/* ── AI PANEL ── */
.ai-panel {
  background: var(--bg3); border: 1px solid var(--border2);
  overflow: hidden; margin-bottom: 12px;
}
.ai-panel-header {
  padding: .85rem 1rem;
  background: linear-gradient(135deg, rgba(0,229,255,0.06), rgba(167,139,250,0.06));
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  border-left: 3px solid var(--cyan);
}
.ai-panel-title { font-family: 'Orbitron', monospace; font-size: 10px; font-weight: 700; color: var(--text); letter-spacing: 0.1em; text-transform: uppercase; }
.ai-badge {
  font-size: 8px; padding: 2px 7px;
  font-weight: 700; font-family: 'Orbitron', monospace;
  background: var(--cyan); color: var(--bg);
  letter-spacing: 0.1em; text-transform: uppercase;
}
.ai-tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--bg2); }
.ai-tab {
  flex: 1; padding: 10px 4px;
  font-size: 8px; font-weight: 700; cursor: pointer;
  border: none; background: none; color: var(--text3);
  font-family: 'Orbitron', monospace; letter-spacing: 0.08em; text-transform: uppercase;
  transition: all .15s; border-bottom: 2px solid transparent;
}
.ai-tab.active { color: var(--cyan); border-bottom-color: var(--cyan); }
.ai-content { padding: 1rem; min-height: 100px; }
.ai-output { font-size: 12px; color: var(--text2); line-height: 1.8; }
.ai-output h3 { font-family: 'Orbitron', monospace; font-size: 10px; font-weight: 700; color: var(--cyan); margin: 1rem 0 .4rem; letter-spacing: 0.1em; text-transform: uppercase; }
.ai-output h3:first-child { margin-top: 0; }
.ai-output p  { margin-bottom: .75rem; }
.ai-output ul { margin: .4rem 0 .75rem 1.2rem; }
.ai-output li { margin-bottom: .35rem; }
.ai-output strong { font-weight: 700; color: var(--text); }
.ai-output em { color: var(--cyan); font-style: normal; font-weight: 700; }
.ai-loading { display: flex; align-items: center; gap: 10px; padding: .5rem 0; color: var(--text2); font-size: 12px; }
.ai-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); animation: pulse 1.2s ease-in-out infinite; }
.ai-dot:nth-child(2) { animation-delay: .3s; background: var(--purple); }
.ai-dot:nth-child(3) { animation-delay: .6s; }
@keyframes pulse { 0%,100%{opacity:.2;transform:scale(.8)} 50%{opacity:1;transform:scale(1.1)} }

/* ── FLASHCARD ── */
.flashcard-wrap { perspective: 1000px; margin-bottom: 12px; }
.flashcard { width: 100%; min-height: 160px; position: relative; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4,0,.2,1); cursor: pointer; }
.flashcard.flipped { transform: rotateY(180deg); }
.flashcard-face {
  position: absolute; width: 100%; min-height: 160px;
  backface-visibility: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 1.25rem; text-align: center;
  border: 1px solid var(--border);
}
.flashcard-face.front { background: linear-gradient(135deg, rgba(79,140,255,0.08), rgba(0,229,255,0.05)); border-color: rgba(79,140,255,0.3); }
.flashcard-face.back  { background: var(--bg2); transform: rotateY(180deg); }
.flashcard-label { font-family: 'Orbitron', monospace; font-size: 8px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text3); margin-bottom: .5rem; }
.flashcard-q { font-family: 'Orbitron', monospace; font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.4; }
.flashcard-a { font-size: 12px; color: var(--text2); line-height: 1.6; }
.flashcard-hint { font-size: 10px; color: var(--text3); margin-top: .75rem; font-family: 'Orbitron', monospace; letter-spacing: 0.06em; }
.flashcard-nav { display: flex; gap: 8px; align-items: center; justify-content: center; margin-bottom: 16px; }
.fc-nav-btn {
  padding: 7px 14px;
  border: 1px solid var(--border2);
  background: transparent; color: var(--text2);
  font-family: 'Orbitron', monospace; font-size: 9px; font-weight: 700;
  letter-spacing: 0.08em; cursor: pointer; transition: all .15s;
}
.fc-nav-btn:hover { border-color: var(--blue); color: var(--blue); }
.fc-counter { font-family: 'Orbitron', monospace; font-size: 10px; color: var(--text3); }

/* ── MAPPA ── */
.mind-map-container { background: var(--bg3); border: 1px solid var(--border); padding: .75rem; margin-bottom: 12px; overflow-x: auto; }
.mind-map-container svg { display: block; margin: 0 auto; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7); z-index: 999;
  display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom);
}
.modal-box {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-top: 2px solid var(--blue);

<script>
// ═══ MODAL HELPERS ═══
function showModal(title,msg,confirmLabel,onConfirm,cancelLabel){
  let el=document.getElementById('_modal');
  if(!el){el=document.createElement('div');el.id='_modal';document.body.appendChild(el);}
  el.innerHTML=`<div class="modal-overlay" id="_modal-overlay">
    <div class="modal-box">
      <div class="modal-title">${escH(title)}</div>
      <div class="modal-msg">${escH(msg)}</div>
      <div class="modal-btns">
        <button class="btn-sec" style="margin:0;flex:1" onclick="closeModal()">${escH(cancelLabel||'Annulla')}</button>
        <button class="btn-main" style="margin:0;flex:1" id="_modal-confirm">${escH(confirmLabel||'OK')}</button>
      </div>
    </div>
  </div>`;
  document.getElementById('_modal-confirm').onclick=()=>{closeModal();onConfirm();};
  document.getElementById('_modal-overlay').onclick=e=>{if(e.target===e.currentTarget)closeModal();};
}
function showAlert(title,msg){
  let el=document.getElementById('_modal');
  if(!el){el=document.createElement('div');el.id='_modal';document.body.appendChild(el);}
  el.innerHTML=`<div class="modal-overlay" id="_modal-overlay">

}
function closeModal(){const el=document.getElementById('_modal');if(el)el.innerHTML='';}

const ORARIO={
  lun:['Scienze','Religione','Fisica','Arte','Ita/Lat'],
  mar:['Ita/Lat','Filosofia','Inglese(lett.)','Fisica','Motoria'],
  mer:['Inglese(lett.)','Storia','Matematica','Matematica','Ita/Lat'],
  gio:['Fisica','Ita/Lat','Matematica','Scienze','Filosofia','Storia'],
  ven:['Motoria','Inglese(lett.)','Ita/Lat','Matematica','Filosofia','Scienze']
};
const GIORNI=['dom','lun','mar','mer','gio','ven','sab'];
const GIORNI_F=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
const MESI_L=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

const HARD=['Matematica','Fisica','Ita/Lat'];
const ALL_SUBJS=['Matematica','Fisica','Ita/Lat','Inglese(lett.)','Filosofia','Storia','Scienze','Arte','Religione','Motoria'];
const TASK_DB={
  'Matematica': [{a:'Svolgi esercizi assegnati',t:'esercizi',m:25},{a:'Ripassare formule e teoremi',t:'ripasso',m:15}],
  'Fisica':     [{a:'Schematizza teoria di oggi',t:'teoria',m:20},{a:'Risolvi 3 problemi',t:'esercizi',m:30}],
  'Ita/Lat':    [{a:'Traduzione e grammatica latina',t:'esercizi',m:30},{a:'Ripasso letteratura italiana',t:'ripasso',m:20}],
  'Inglese(lett.)':[{a:'Ripasso testo/autore letteratura inglese',t:'ripasso',m:20},{a:'Analisi del testo in inglese',t:'teoria',m:25},{a:'Vocaboli e strutture grammaticali',t:'esercizi',m:15}],
  'Filosofia':  [{a:'Schema del concetto visto',t:'teoria',m:20},{a:'Ripasso corrente filosofica',t:'ripasso',m:15}],
  'Storia':     [{a:'Leggi capitolo + schema',t:'teoria',m:20},{a:'Ripassare date e eventi',t:'ripasso',m:10}],
  'Scienze':    [{a:'Ripassare teoria',t:'ripasso',m:15},{a:'Schema concetti chiave',t:'teoria',m:15}],
  'Arte':       [{a:'Rivedere opere e autore',t:'ripasso',m:10}],
  'Motoria':[],'Religione':[]
};
const TIPO_LABEL={v:'Verifica',i:'Interrogazione',p:'Progetto',c:'Compito'};
const TIPO_COLOR={v:'var(--red)',i:'var(--gold)',p:'var(--cyan)',c:'var(--blue)'};
const TIPO_BG={v:'rgba(239,68,68,0.1)',i:'rgba(251,191,36,0.1)',p:'rgba(0,229,255,0.08)',c:'rgba(79,140,255,0.1)'};
const SUBJ_COLORS=['#a78bfa','#00e5ff','#fbbf24','#4f8cff','#10b981','#f97316','#ef4444','#e879f9','#6366f1','#14b8a6'];

// ═══ STATE ═══
let ST={
  tasks:[],
  recovery: LS('rec',[]),
  notes:    LS('notes',[]),
  ver:      LS('ver',[]),
  streak:   LS('streak',[]),
  compiti:  LS('compiti',[]),
  voti:     LS('voti',[]),
  currentTask:null,
  timerSec:0,timerTotal:0,timerRunning:false,timerInt:null,timerEnd:null,mvd:false
};
let currentPage='oggi';
let calState={year:new Date().getFullYear(),month:new Date().getMonth(),selectedDay:null};
let votiTab='lista';
let votiSubjFilter='all';
let aiState={loading:false,result:null,noteId:null,activeTab:'riscrivi'};
const uiSt={grafSubj:null,fcData:{},fcIdx:{},fcFlip:{},mapData:{}};

function LS(k,d){try{return JSON.parse(localStorage.getItem('sv4_'+k)||'null')||d}catch{return d}}
async function loadSTFromSQLite(){
  const keys=['rec','notes','ver','streak','compiti','voti'];
  for(const k of keys){
    if(window.db?.study?.getBlob){
      try{const v=await window.db.study.getBlob(k);if(v!=null)ST[k]=v;}catch(_){}
    }
  }
}
async function save(){
  const keys=['rec','notes','ver','streak','compiti','voti'];
  if(window.db?.study){
    for(const k of keys){try{await window.db.study.setBlob(k,ST[k]);}catch(_){}}
  }
  keys.forEach(k=>localStorage.setItem('sv4_'+k,JSON.stringify(ST[k])));
  updateRecBadge();
}

// ═══ UTILS ═══
function todayKey(){return GIORNI[new Date().getDay()]}
function isoDateKey(d){const dt=d||new Date();return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function todaySubjs(){return ORARIO[todayKey()]||[]}
function fmtDate(d){return d.getDate()+' '+MESI[d.getMonth()]}
function daysBetween(ds){const t=new Date(),d=new Date(ds);t.setHours(0,0,0,0);d.setHours(0,0,0,0);return Math.round((d-t)/(864e5))}
function uid(){return Date.now()+''+Math.floor(Math.random()*9999)}
function isoToday(){return new Date().toISOString().split('T')[0]}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function votoClass(v){return v>=7?'top':v>=5.5?'mid':'low'}
function colorForSubj(s){return SUBJ_COLORS[ALL_SUBJS.indexOf(s)%SUBJ_COLORS.length]||'var(--blue)'}

// ═══ NAV ═══
function goPage(p){
  currentPage=p;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('pg-'+p).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const nb=document.getElementById('nb-'+p)||document.getElementById('nb-oggi');
  if(nb)nb.classList.add('active');
  if(p==='oggi')renderOggi();
  else if(p==='studio')renderStudio();
  else if(p==='compiti')renderCompiti();
  else if(p==='calendario')renderCalendario();
  else if(p==='voti')renderVoti();
  else if(p==='verifiche')renderVerifiche();
  else if(p==='note')renderNote();
  else if(p==='metodo')renderMetodo();
}

// ═══ FOCUS ═══
function showFocus(task){
  ST.currentTask=task;clearInterval(ST.timerInt);ST.timerRunning=false;
  ST.timerSec=task.m*60;ST.timerTotal=task.m*60;
  ['fc-sub','fc-title','fc-det','fc-st','fc-play','prog-f'].forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    if(id==='fc-sub')el.textContent=task.subj;
    else if(id==='fc-title')el.textContent=task.a;
    else if(id==='fc-det')el.textContent=task.m+' min · '+task.t;
    else if(id==='fc-st')el.textContent='PREMI PLAY PER INIZIARE';
    else if(id==='fc-play')el.innerHTML='&#9654; PLAY';
    else if(id==='prog-f')el.style.width='0%';
  });
  updTimer();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('pg-focus').classList.add('active');
  document.querySelector('.nav-bottom').style.display='none';
}
function exitFocus(){clearInterval(ST.timerInt);ST.timerRunning=false;goPage(currentPage)}
function updTimer(){
  const m=Math.floor(ST.timerSec/60),s=ST.timerSec%60;
  document.getElementById('fc-timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  const pct=ST.timerTotal>0?Math.round((1-ST.timerSec/ST.timerTotal)*100):0;
  document.getElementById('prog-f').style.width=pct+'%';
}
function toggleTimer(){
  if(ST.timerRunning){
    clearInterval(ST.timerInt);ST.timerRunning=false;
    ST.timerSec=Math.max(0,Math.round((ST.timerEnd-Date.now())/1000));
    document.getElementById('fc-play').innerHTML='&#9654; RIPRENDI';
    document.getElementById('fc-st').textContent='// IN PAUSA';
    updTimer();
  }else{
    ST.timerRunning=true;
    ST.timerEnd=Date.now()+ST.timerSec*1000;
    document.getElementById('fc-play').innerHTML='⏸ PAUSA';
    document.getElementById('fc-st').textContent='CONCENTRATI — ZERO DISTRAZIONI';
    ST.timerInt=setInterval(()=>{
      const remaining=Math.max(0,Math.round((ST.timerEnd-Date.now())/1000));
      ST.timerSec=remaining;
      updTimer();
      if(remaining<=0){clearInterval(ST.timerInt);ST.timerRunning=false;document.getElementById('fc-st').textContent='⚠ TEMPO SCADUTO';document.getElementById('fc-play').innerHTML='&#9654; PLAY';}
    },500);
  }
}
function adjTimer(d){clearInterval(ST.timerInt);ST.timerRunning=false;ST.timerEnd=null;document.getElementById('fc-play').innerHTML='&#9654; PLAY';ST.timerSec=Math.max(60,ST.timerSec+d*60);if(d>0)ST.timerTotal=ST.timerSec;updTimer();document.getElementById('fc-st').textContent='REGOLATO — PREMI PLAY';}
function doneTask(){clearInterval(ST.timerInt);if(ST.currentTask){const t=ST.tasks.find(x=>x.id===ST.currentTask.id);if(t){t.done=true;ST.recovery=ST.recovery.filter(r=>r.id!==t.id);save();}}exitFocus();}
function skipTask(){clearInterval(ST.timerInt);if(ST.currentTask){const t=ST.tasks.find(x=>x.id===ST.currentTask.id);if(t){t.done=true;addRec(t);}}exitFocus();}

// ═══ RECOVERY ═══
function addRec(t){const ex=ST.recovery.find(r=>r.id===t.id);if(ex)ex.days=(ex.days||1)+1;else ST.recovery.push({...t,days:1,movedDate:fmtDate(new Date())});save();}
function quickDone(id){const t=ST.tasks.find(x=>String(x.id)===String(id));if(!t)return;t.done=true;ST.recovery=ST.recovery.filter(r=>String(r.id)!==String(id));save();renderStudio();}
function quickRec(id){const t=ST.tasks.find(x=>String(x.id)===String(id));if(!t)return;t.done=true;addRec(t);save();renderStudio();}
function quickDoneOggi(id){const t=ST.tasks.find(x=>String(x.id)===String(id));if(!t)return;t.done=true;ST.recovery=ST.recovery.filter(r=>String(r.id)!==String(id));save();renderOggi();}
function dismissRec(id){ST.recovery=ST.recovery.filter(r=>String(r.id)!==String(id));save();renderStudio();}
function addDayRec(id){const r=ST.recovery.find(x=>String(x.id)===String(id));if(r)r.days=(r.days||1)+1;save();renderStudio();}

// ═══ GENERATE TASKS ═══
function generateTasks(mvd){
  ST.mvd=!!mvd;
  const subjs=[...new Set(todaySubjs().filter(s=>TASK_DB[s]&&TASK_DB[s].length>0))];
  const recObbl=ST.recovery.filter(r=>r.days>=2);
  ST.tasks=[];
  recObbl.slice(0,1).forEach(r=>ST.tasks.push({...r,priority:'obbl',done:false,fromRec:true}));
  const sorted=[...subjs].sort((a,b)=>(HARD.includes(b)?1:0)-(HARD.includes(a)?1:0));
  const limit=mvd?Math.min(2,sorted.length):Math.min(sorted.length<=2?2:sorted.length<=4?3:4,sorted.length);
  sorted.slice(0,limit).forEach(s=>{
    const opts=TASK_DB[s],tpl=opts[Math.floor(Math.random()*opts.length)];
    const isH=HARD.includes(s);
    const todayVer=ST.ver.find(v=>v.subj===s&&daysBetween(v.date)<=1&&daysBetween(v.date)>=0);
    ST.tasks.push({id:uid(),subj:s,a:todayVer?`Studia per ${todayVer.tipo==='i'?'interrogazione':'verifica'} di ${s}`:tpl.a,t:tpl.t,m:mvd?Math.min(tpl.m,12):tpl.m,priority:todayVer?'high':isH?'mid':'lo',done:false});
  });
  save();renderStudio();
}

// ═══ EXPORT / IMPORT ═══
function exportDati(){
  const data=JSON.stringify({ver:ST.ver,notes:ST.notes,streak:ST.streak,compiti:ST.compiti,voti:ST.voti,recovery:ST.recovery},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='studio_backup_'+isoToday()+'.json';a.click();URL.revokeObjectURL(a.href);
}
function importDati(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        showModal('Importa backup','Stai per sovrascrivere tutti i dati con il backup. Sei sicuro?','Importa',()=>{
          if(d.ver)ST.ver=d.ver;if(d.notes)ST.notes=d.notes;if(d.streak)ST.streak=d.streak;
          if(d.compiti)ST.compiti=d.compiti;if(d.voti)ST.voti=d.voti;if(d.recovery)ST.recovery=d.recovery;
          save();goPage(currentPage);
        });
      }catch{showAlert('Errore','File non valido.');}
    };
    reader.readAsText(file);
  };
  inp.click();
}

// ═══ STREAK ═══
function streakHtml(){
  const now=new Date(),days=[];
  for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);days.push(d);}
  return `<div class="streak-row">${days.map(d=>{
    const k=isoDateKey(d),ok=ST.streak.includes(k),td=d.toDateString()===now.toDateString();
    return `<div class="s-day ${ok?'ok':''} ${td?'td':''}"><span class="sn">${d.getDate()}</span>${GIORNI[d.getDay()]}</div>`;
  }).join('')}</div>`;
}

// ═══════════════════════════════════
// PAGE: OGGI
// ═══════════════════════════════════
function renderOggi(){
  const now=new Date(),tk=todayKey();
  const subjs=ORARIO[tk]||[];
  const ver=ST.ver.filter(v=>{const d=daysBetween(v.date);return d>=0&&d<=4}).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const compitiOggi=ST.compiti.filter(c=>!c.done&&daysBetween(c.date)<=2&&daysBetween(c.date)>=0).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const pendingRec=ST.recovery.filter(r=>r.days>=1).length;

  const taskPreview=ST.tasks.length===0
    ?`<button class="btn-main" onclick="goPage('studio')">GENERA PIANO DI STUDIO &#8594;</button>`
    :ST.tasks.slice(0,3).map(t=>`
      <div class="card ${t.priority==='high'?'hi':t.priority==='mid'?'md':t.priority==='obbl'?'obbl':'lo'} ${t.done?'done-c':''}">
        <div class="card-meta">
          <span class="badge ${t.priority==='high'?'bhi':t.priority==='mid'?'bmd':t.priority==='obbl'?'bobbl':'blo'}">${t.priority==='high'?'Alta':t.priority==='mid'?'Media':t.priority==='obbl'?'Obbl.':'Bassa'}</span>
          <span class="badge btype">${t.t||''}</span><span class="badge btime">${t.m}m</span>
        </div>
        <div class="card-title">${escH(t.subj)}</div><div class="card-sub">${escH(t.a)}</div>
        ${t.done?'<div style="font-size:10px;color:var(--green);margin-top:6px;font-family:\'Orbitron\',monospace;letter-spacing:0.1em">✓ COMPLETATO</div>':`

    +(ST.tasks.length>3?`<div style="text-align:center;font-size:9px;color:var(--text2);cursor:pointer;padding:.5rem 0;font-family:'Orbitron',monospace;letter-spacing:0.08em" onclick="goPage('studio')">+${ST.tasks.length-3} ALTRI &#8594;</div>`:'');

  document.getElementById('pg-oggi').innerHTML=`

      <div>
        <div style="font-family:'Orbitron',monospace;font-size:8px;color:var(--blue);letter-spacing:0.3em;text-transform:uppercase;margin-bottom:6px;opacity:0.8">// STUDIO OS</div>
        <div class="page-title">STUDIO<span>.</span></div>
        <div class="page-sub">${GIORNI_F[now.getDay()].toUpperCase()} · ${fmtDate(now).toUpperCase()}</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:flex-start">
        ${pendingRec>0?`<span style="background:rgba(249,115,22,0.1);color:var(--orange);font-family:'Orbitron',monospace;font-size:8px;padding:5px 10px;cursor:pointer;border:1px solid rgba(249,115,22,0.3);letter-spacing:0.1em" onclick="goPage('studio')">&#8635; ${pendingRec}</span>`:''}
        <button onclick="checkinNow()" style="border:1px solid rgba(167,139,250,0.3);background:rgba(167,139,250,0.08);color:var(--purple);padding:5px 11px;font-family:'Orbitron',monospace;font-size:8px;cursor:pointer;letter-spacing:0.1em">✓ SERALE</button>
        <button onclick="exportDati()" style="border:1px solid var(--border2);background:var(--bg3);color:var(--text3);padding:5px 9px;font-family:'Orbitron',monospace;font-size:12px;cursor:pointer" title="Backup">⬇</button>

function compitoCardHtml(c,muted=false){
  const d=daysBetween(c.date);
  const urgente=!c.done&&d<=1&&d>=0;
  const scaduto=!c.done&&d<0;
  return `<div class="compito-card tipo-${c.tipo} ${scaduto?'scaduto':''}" style="opacity:${muted?.5:1}">
    <div class="compito-check ${c.done?'done':''}" onclick="toggleCompito('${c.id}')">
      ${c.done?'<span style="color:var(--bg);font-size:12px;font-weight:700">✓</span>':''}
    </div>
    <div class="compito-body">
      <div class="compito-title" style="${c.done?'text-decoration:line-through;color:var(--text3)':''}">${escH(c.titolo)}</div>
      <div class="compito-meta" style="margin-top:4px">
        <span class="pill-tag" style="background:${TIPO_BG[c.tipo]};color:${TIPO_COLOR[c.tipo]};border:1px solid">${TIPO_LABEL[c.tipo]}</span>
        <span class="pill-tag" style="background:var(--bg3);color:var(--text3);border:1px solid var(--border)">${escH(c.subj)}</span>
        <span class="compito-scad" style="color:${urgente?'var(--red)':scaduto?'var(--text3)':'var(--text3)'}">${scaduto?'SCADUTO':d===0?'OGGI':d===1?'DOMANI':new Date(c.date).toLocaleDateString('it-IT',{day:'numeric',month:'short'})}</span>
      </div>
      ${c.note?`<div style="font-size:11px;color:var(--text2);margin-top:4px">${escH(c.note)}</div>`:''}
    </div>
    <button onclick="delCompito('${c.id}')" style="border:none;background:none;cursor:pointer;color:var(--text3);font-size:16px;padding:4px;line-height:1;flex-shrink:0">✕</button>
  </div>`;
}

function buildSuggestedCompiti(){
  const subjs=[...new Set(todaySubjs().filter(s=>s!=='Motoria'&&s!=='Religione'))];
  return subjs.slice(0,3).map(s=>({subj:s,tipo:'c',label:`Compito di ${s}`}));
}

function updateSuggeriti(){}

function fillSuggerito(subj,tipo){
  document.getElementById('cp-subj').value=subj;
  document.getElementById('cp-tipo').value=tipo;
  document.getElementById('cp-titolo').focus();
}

function addCompito(){
  const titolo=document.getElementById('cp-titolo').value.trim();
  const subj=document.getElementById('cp-subj').value;
  const tipo=document.getElementById('cp-tipo').value;
  const date=document.getElementById('cp-date').value;
  const note=document.getElementById('cp-note').value.trim();
  if(!titolo||!date)return;
  if(daysBetween(date)<0)return showModal('Data nel passato','Hai selezionato una data già passata. Vuoi aggiungerlo lo stesso?','Sì, aggiungi',()=>{
    _doAddCompito(titolo,subj,tipo,date,note);
  });
  _doAddCompito(titolo,subj,tipo,date,note);
}
function _doAddCompito(titolo,subj,tipo,date,note){
  ST.compiti.push({id:uid(),titolo,subj,tipo,date,note,done:false,addedAt:isoToday()});
  if(tipo==='v'||tipo==='i'){ST.ver.push({id:uid(),subj,tipo,date,note});}
  save();renderCompiti();
}

function toggleCompito(id){
  const c=ST.compiti.find(x=>String(x.id)===String(id));
  if(c){c.done=!c.done;save();renderCompiti();}
}
function delCompito(id){ST.compiti=ST.compiti.filter(x=>String(x.id)!==String(id));save();renderCompiti();}

// PAGE: CALENDARIO
// ═══════════════════════════════════
function renderCalendario(){
  const {year,month}=calState;
  const firstDay=new Date(year,month,1);
  const lastDay=new Date(year,month+1,0);
  const startDow=(firstDay.getDay()+6)%7;
  const today=new Date();
  const eventiMese=[...ST.ver,...ST.compiti].filter(e=>{
    const d=new Date(e.date);return d.getFullYear()===year&&d.getMonth()===month;
  });
  const byDay={};
  eventiMese.forEach(e=>{
    const d=new Date(e.date).getDate();
    if(!byDay[d])byDay[d]=[];
    byDay[d].push(e);
  });
  let cells='';
  const totalCells=Math.ceil((startDow+lastDay.getDate())/7)*7;
  for(let i=0;i<totalCells;i++){
    const dayN=i-startDow+1;
    const valid=dayN>=1&&dayN<=lastDay.getDate();
    const isToday=valid&&today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===dayN;
    const events=valid?byDay[dayN]||[]:[];
    const isSelected=calState.selectedDay===dayN&&valid;
    cells+=`<div class="cal-cell ${valid?'':'other-month'}"
      style="${isSelected?'background:rgba(79,140,255,0.1);border:1px solid rgba(79,140,255,0.3)':''}"
      onclick="${valid?`selectCalDay(${dayN})`:''}">
      <div class="cal-num" style="${isToday?'background:var(--blue);color:var(--bg);':''}${isSelected&&!isToday?'color:var(--blue)':''}">${valid?dayN:''}</div>
      <div class="cal-dots">
        ${events.slice(0,3).map(e=>`<div class="cal-dot" style="background:${TIPO_COLOR[e.tipo]||'var(--blue)'}"></div>`).join('')}
      </div>
    </div>`;
  }
  let dayDetail='';
  if(calState.selectedDay){
    const evs=byDay[calState.selectedDay]||[];
    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(calState.selectedDay).padStart(2,'0')}`;
    dayDetail=`<div class="cal-day-detail">
      <div class="cal-day-title">${calState.selectedDay} ${MESI_L[month].toUpperCase()}</div>
      ${evs.length===0?'<div style="font-size:11px;color:var(--text3);font-family:\'Orbitron\',monospace;letter-spacing:0.08em">// NESSUN EVENTO</div>':
        evs.map(e=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <div style="width:3px;height:30px;background:${TIPO_COLOR[e.tipo]||'var(--blue)'};flex-shrink:0"></div>
          <div style="flex:1">
            <div style="font-family:'Orbitron',monospace;font-size:11px;font-weight:700;color:var(--text);letter-spacing:0.04em">${escH(e.titolo||e.subj)}</div>
            <div style="font-size:10px;color:var(--text3)">${TIPO_LABEL[e.tipo]||e.tipo} · ${escH(e.subj)}</div>
          </div>
          <button onclick="delEventoCal('${e.id}','${e.tipo==='v'||e.tipo==='i'?'ver':'compiti'}')" style="border:none;background:none;cursor:pointer;color:var(--text3);font-size:14px;padding:2px">✕</button>
        </div>`).join('')}
      <button class="btn-sec" style="margin:8px 0 0;padding:8px;font-size:8px" onclick="addEventoCal('${ds}')">+ AGGIUNGI EVENTO</button>
    </div>`;
  }
  const legenda=Object.entries(TIPO_LABEL).map(([k,l])=>`<span style="display:inline-flex;align-items:center;gap:5px;font-family:'Orbitron',monospace;font-size:8px;color:var(--text3);margin-right:12px;letter-spacing:0.06em"><span style="width:6px;height:6px;border-radius:50%;background:${TIPO_COLOR[k]};display:inline-block"></span>${l.toUpperCase()}</span>`).join('');

  document.getElementById('pg-calendario').innerHTML=`
  <div class="page-header">
    <div class="page-title">CAL<span>.</span></div>
    <div class="page-sub">VERIFICHE · INTERROGAZIONI · PROGETTI</div>
  </div>
  <div class="ph" style="padding-top:1rem">
    <div class="cal-header">
      <button class="cal-nav" onclick="calMove(-1)">&#8592;</button>
      <span class="cal-month">${MESI_L[month].toUpperCase()} ${year}</span>
      <button class="cal-nav" onclick="calMove(1)">&#8594;</button>
    </div>
    <div class="cal-grid">
      ${['LUN','MAR','MER','GIO','VEN','SAB','DOM'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <div style="margin-bottom:1rem">${legenda}</div>
    ${dayDetail}
    <div class="divider"></div>
    <div class="sec-label">Prossimi eventi</div>
    ${buildProssimiEventi()}
  </div>`;
}

function buildProssimiEventi(){
  const now=isoToday();
  const tutti=[
    ...ST.ver.map(v=>({...v,_src:'ver'})),
    ...ST.compiti.filter(c=>!c.done).map(c=>({...c,_src:'compiti'}))
  ].filter(e=>e.date>=now).sort((a,b)=>a.date.localeCompare(b.date));
  if(!tutti.length)return'<div class="empty">// NESSUN EVENTO IN PROGRAMMA</div>';
  return tutti.slice(0,8).map(e=>{
    const d=daysBetween(e.date),vd=new Date(e.date);
    return `<div class="ver-card ${d===0?'urgent':d<=2?'soon':''}">
      <div class="ver-date-box" style="border-color:${TIPO_COLOR[e.tipo]||'var(--blue)'};opacity:0.8">
        <div class="ver-day-n" style="color:${TIPO_COLOR[e.tipo]||'var(--blue)'}">${vd.getDate()}</div>
        <div class="ver-mon" style="color:${TIPO_COLOR[e.tipo]||'var(--blue)'}">${MESI[vd.getMonth()]}</div>
      </div>
      <div class="ver-info">
        <div class="ver-title">${escH(e.titolo||e.subj)}</div>
        <div style="display:flex;gap:5px;align-items:center;margin:4px 0">
          <span class="pill-tag" style="background:${TIPO_BG[e.tipo]||'rgba(79,140,255,0.1)'};color:${TIPO_COLOR[e.tipo]||'var(--blue)'};border:1px solid">${TIPO_LABEL[e.tipo]||e.tipo}</span>
          <span style="font-family:'Orbitron',monospace;font-size:9px;color:var(--text3)">${d===0?'OGGI':d===1?'DOMANI':d+' GG'}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function calMove(dir){
  calState.month+=dir;
  if(calState.month>11){calState.month=0;calState.year++;}
  if(calState.month<0){calState.month=11;calState.year--;}
  calState.selectedDay=null;
  renderCalendario();
}
function selectCalDay(d){
  calState.selectedDay=calState.selectedDay===d?null:d;
  renderCalendario();
}
function delEventoCal(id,src){
  if(src==='ver')ST.ver=ST.ver.filter(x=>String(x.id)!==String(id));
  else ST.compiti=ST.compiti.filter(x=>String(x.id)!==String(id));
  save();renderCalendario();
}
function addEventoCal(date){
  goPage('compiti');
  setTimeout(()=>{const el=document.getElementById('cp-date');if(el)el.value=date;},100);
}

            <span style="font-family:'Orbitron',monospace;font-size:9px;color:var(--text3)">${d<0?'PASSATA':d===0?'OGGI':d===1?'DOMANI':d+' GG'}</span>
          </div>
          ${v.note?`<div style="font-size:11px;color:var(--text2)">${escH(v.note)}</div>`:''}
        </div>
        <button onclick="delVer('${v.id}')" style="border:none;background:none;cursor:pointer;color:var(--text3);font-size:18px;padding:4px;line-height:1">✕</button>
      </div>`;
    }).join('')}
  </div>`;
}
function addVer(){
  const subj=document.getElementById('v-subj').value,tipo=document.getElementById('v-tipo').value,date=document.getElementById('v-date').value,note=document.getElementById('v-note').value.trim();
  if(!date)return;
  const doAdd=()=>{ST.ver.push({id:uid(),subj,tipo,date,note});save();renderVerifiche();};
  if(daysBetween(date)<0)return showModal('Data nel passato','Vuoi aggiungere una verifica già passata?','Sì, aggiungi',doAdd);
  doAdd();
}
function delVer(id){ST.ver=ST.ver.filter(v=>String(v.id)!==String(id));save();renderVerifiche();}

function renderVotiMedie(){

function renderVotiGrafico(){
  if(ST.voti.length<2) return '<div class="empty">// AGGIUNGI ALMENO 2 VOTI</div>';
  const bySubj={};
  ST.voti.forEach(v=>{if(!bySubj[v.subj])bySubj[v.subj]=[];bySubj[v.subj].push({data:v.data,voto:parseFloat(v.voto)});});
  Object.values(bySubj).forEach(arr=>arr.sort((a,b)=>a.data.localeCompare(b.data)));
  const subjList=Object.keys(bySubj);
  if(!uiSt.grafSubj||!bySubj[uiSt.grafSubj])uiSt.grafSubj=subjList[0];
  const sel=uiSt.grafSubj;
  const pts=bySubj[sel];
  const W=340,H=180,padL=28,padR=10,padT=10,padB=30;
  const iW=W-padL-padR,iH=H-padT-padB;
  const minV=Math.max(0,Math.min(...pts.map(p=>p.voto))-1);
  const maxV=Math.min(10,Math.max(...pts.map(p=>p.voto))+1);
  const xScale=i=>(i/(pts.length-1))*iW+padL;
  const yScale=v=>padT+iH-(((v-minV)/(maxV-minV))*iH);
  let gridLines='';
  for(let g=Math.ceil(minV);g<=Math.floor(maxV);g++){
    const y=yScale(g);
    gridLines+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#1a2a38" stroke-width="1"/>`;
    gridLines+=`<text x="${padL-4}" y="${y+4}" text-anchor="end" font-size="9" fill="#3d5568" font-family="Orbitron,monospace">${g}</text>`;
  }
  const linePts=pts.map((p,i)=>`${xScale(i).toFixed(1)},${yScale(p.voto).toFixed(1)}`);
  const fillPts=[`${padL},${padT+iH}`,...linePts,`${xScale(pts.length-1)},${padT+iH}`];
  const dots=pts.map((p,i)=>{
    const x=xScale(i),y=yScale(p.voto);
    const cl=votoClass(p.voto);
    const col=cl==='top'?'#10b981':cl==='mid'?'#fbbf24':'#ef4444';
    const lbl=new Date(p.data).toLocaleDateString('it-IT',{day:'numeric',month:'short'});
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="${col}" stroke="#060a0e" stroke-width="2"/>
      <text x="${x.toFixed(1)}" y="${y<padT+15?y+18:y-10}" text-anchor="middle" font-size="10" font-weight="700" fill="${col}" font-family="Orbitron,monospace">${p.voto}</text>
      ${i===0||i===pts.length-1?`<text x="${x.toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="8" fill="#3d5568" font-family="Orbitron,monospace">${lbl}</text>`:''}`;
  }).join('');
  const mediaV=pts.reduce((a,b)=>a+b.voto,0)/pts.length;
  const mediaY=yScale(mediaV).toFixed(1);
  const svg=`<svg width="100%" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="display:block">
    ${gridLines}
    <line x1="${padL}" y1="${mediaY}" x2="${W-padR}" y2="${mediaY}" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
    <polygon points="${fillPts.join(' ')}" fill="#4f8cff" opacity="0.05"/>
    <polyline points="${linePts.join(' ')}" fill="none" stroke="#4f8cff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg>`;
  const tabs=subjList.map(s=>`<button class="pill-tag" style="cursor:pointer;flex-shrink:0;background:${sel===s?colorForSubj(s):'var(--bg3)'};color:${sel===s?'var(--bg)':'var(--text2)'};border:1px solid ${sel===s?colorForSubj(s):'var(--border)'}" onclick="setGrafSubj('${escH(s)}')">${escH(s).toUpperCase().slice(0,6)}</button>`).join('');
  const trendVal=pts.length>=2?pts[pts.length-1].voto-pts[0].voto:0;
  const trendStr=trendVal>0?`↑ +${trendVal.toFixed(1)}`:trendVal<0?`↓ ${trendVal.toFixed(1)}`:'— stabile';
  const trendCol=trendVal>0?'var(--green)':trendVal<0?'var(--red)':'var(--text2)';
  return `
    <div style="display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px">${tabs}</div>
    <div class="chart-wrap">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div class="chart-title">${escH(sel).toUpperCase()}</div>
        <div style="font-family:'Orbitron',monospace;font-size:10px;font-weight:700;color:${trendCol}">${trendStr}</div>
      </div>
      ${svg}
    </div>
    <div style="background:var(--bg2);border:1px solid var(--border);padding:.75rem 1rem">
      <div style="font-family:'Orbitron',monospace;font-size:8px;font-weight:700;color:var(--text3);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:8px">// STORICO</div>
      ${bySubj[sel].map(p=>`<div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:6px;font-size:12px">
        <span style="font-family:'Orbitron',monospace;font-weight:900;color:${votoClass(p.voto)==='top'?'var(--green)':votoClass(p.voto)==='mid'?'var(--gold)':'var(--red)'};min-width:28px">${p.voto}</span>
        <span style="color:var(--text3);font-family:'Orbitron',monospace;font-size:9px;min-width:50px">${new Date(p.data).toLocaleDateString('it-IT',{day:'numeric',month:'short'})}</span>
        <span style="color:var(--text2)">${escH(ST.voti.find(v=>v.data===p.data&&v.subj===sel&&parseFloat(v.voto)===p.voto)?.arg||'—')}</span>
      </div>`).join('')}
    </div>`;
}

// ═══════════════════════════════════
// FILE IMPORT (PDF / DOCX / TXT)
// ═══════════════════════════════════
function noteDragOver(e){e.preventDefault();document.getElementById('note-file-drop')?.classList.add('drag-over');}
function noteDragLeave(){document.getElementById('note-file-drop')?.classList.remove('drag-over');}
function noteFileDrop(e){e.preventDefault();noteDragLeave();const f=e.dataTransfer?.files?.[0];if(f)processNoteFile(f);}
function noteFileSelected(inp){const f=inp.files?.[0];if(f)processNoteFile(f);}

async function processNoteFile(file){
  const statusEl=document.getElementById('note-file-status');
  const textEl=document.getElementById('n-text');
  if(!statusEl||!textEl)return;
  const name=file.name;
  const ext=name.split('.').pop().toLowerCase();
  statusEl.innerHTML=`<div class="upload-processing"><div class="ai-loading"><div class="ai-dot"></div><div class="ai-dot"></div><div class="ai-dot"></div></div>Elaborando ${escH(name)}...</div>`;
  try{
    let content='';
    if(ext==='txt'){
      content=await file.text();
    } else if(ext==='pdf'){
      // Read PDF as base64 and send to AI for extraction
      const b64=await fileToBase64(file);
      content=await extractTextViaAI(b64,'application/pdf',name);
    } else if(ext==='doc'||ext==='docx'){
      // For docx we try to read as arraybuffer and extract text
      content=await extractDocxText(file);
    } else {
      content=await file.text();
    }
    if(content && content.length>10){
      textEl.value=content.slice(0,4000); // cap at 4000 chars
      statusEl.innerHTML=`<div class="file-loaded-badge">📄 ${escH(name)} — ${content.length} caratteri importati <button onclick="clearNoteFile()">✕</button></div>`;
    } else {
      statusEl.innerHTML=`<div style="color:var(--red);font-family:'Orbitron',monospace;font-size:10px;padding:6px 0">// Impossibile leggere il file — riprova o incolla il testo</div>`;
    }
  }catch(err){

function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(',')[1]);
    r.onerror=()=>rej(new Error('Lettura file fallita'));
    r.readAsDataURL(file);
  });
}

async function extractTextViaAI(base64Data, mediaType, fileName){
  // Estrazione testo tramite server Groq locale
  const prompt = `Sei un estrattore di testo. Analizza questo documento (${fileName}) e restituisci SOLO il testo estratto, mantenendo la struttura (titoli, paragrafi, elenchi). Nessun commento aggiuntivo.`;
  try {

async function extractDocxText(file){
  // Try to extract text from docx using XML parsing
  try{
    const arrayBuffer=await file.arrayBuffer();
    // Try JSZip approach — check if available
    if(typeof JSZip!=='undefined'){
      const zip=await JSZip.loadAsync(arrayBuffer);
      const xmlFile=zip.file('word/document.xml');
      if(xmlFile){
        const xml=await xmlFile.async('string');
        const text=xml.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
        return text;
      }
    }
    // Fallback: read as text (works for .txt disguised as docx)
    return await file.text();
  }catch(e){
    // If docx parsing fails, try AI extraction
    const b64=await fileToBase64(file);
    // Send as base64 text for AI to try
    return await callAI(`Ho un documento Word. Il testo seguente è codificato in base64. Prova a estrarne il contenuto testuale leggibile: [il file è stato caricato ma non è possibile decodificarlo direttamente - chiedi all'utente di incollare il testo manualmente]`);
  }
}

function buildMindMapSVG(data){
  const W=360,H=280,cx=W/2,cy=H/2;const rami=data.rami||[];const n=rami.length;
  let paths='',nodes='',lbls='';
  nodes+=`<ellipse cx="${cx}" cy="${cy}" rx="60" ry="26" fill="#4f8cff" opacity=".8"/>`;
  lbls+=`<text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="10" font-weight="700" fill="#060a0e" font-family="Orbitron,monospace">${escH(data.centro)}</text>`;
  rami.forEach((r,i)=>{
    const a=(2*Math.PI/n)*i-Math.PI/2,bx=cx+130*Math.cos(a),by=cy+90*Math.sin(a);
    paths+=`<line x1="${cx}" y1="${cy}" x2="${bx}" y2="${by}" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="4,2" opacity=".5"/>`;
    const bw=Math.min(72,r.label.length*7+16);
    nodes+=`<rect x="${bx-bw/2}" y="${by-13}" width="${bw}" height="26" rx="2" fill="#0a1018" stroke="#00e5ff" stroke-width="1" opacity="0.9"/>`;
    lbls+=`<text x="${bx}" y="${by+5}" text-anchor="middle" font-size="9" font-weight="700" fill="#00e5ff" font-family="Orbitron,monospace">${escH(r.label)}</text>`;
    (r.figli||[]).forEach((f,j)=>{
      const ca=a+(j-(r.figli.length-1)/2)*0.4,crx=bx+66*Math.cos(ca),cry=by+66*Math.sin(ca);
      paths+=`<line x1="${bx}" y1="${by}" x2="${crx}" y2="${cry}" stroke="#1a2a38" stroke-width="1.5" opacity=".8"/>`;
      const fw=Math.min(62,f.length*6+10);
      nodes+=`<rect x="${crx-fw/2}" y="${cry-10}" width="${fw}" height="20" rx="2" fill="#0f1820" stroke="#203040" stroke-width="1"/>`;
      lbls+=`<text x="${crx}" y="${cry+4}" text-anchor="middle" font-size="9" fill="#8da0b3" font-family="Space Mono,monospace">${escH(f.length>10?f.slice(0,10)+'…':f)}</text>`;
    });
  });
  return`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${paths}${nodes}${lbls}</svg>`;
}

function md2html(md){
  if(!md)return'';
  return md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/^[-•] (.+)$/gm,'<li>$1</li>')
    .split('\n').map(l=>l.trim()).filter(Boolean)
    .map(l=>l.startsWith('<')?l:`<p>${l}</p>`).join('');
}

function buildCoachContext(subj) {
  const today = isoToday();
  const todayFmt = new Date().toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long'});
  const hour = new Date().getHours();
  const fascia = hour < 12 ? 'mattina' : hour < 18 ? 'pomeriggio' : 'sera';

  // Voti per questa materia
  const votiSubj = ST.voti
    .filter(v => v.subj === subj)
    .slice(-8)
    .map(v => `${v.voto}/10 (${v.tipo==='i'?'interr.':'scritto'} del ${v.data}${v.arg?', argomento: '+v.arg:''})`);
  const mediaSubj = votiSubj.length
    ? (ST.voti.filter(v=>v.subj===subj).reduce((s,v)=>s+parseFloat(v.voto),0) / ST.voti.filter(v=>v.subj===subj).length).toFixed(1)
    : null;

  // Prossima verifica per questa materia
  const prossimaVer = ST.ver
    .filter(v => v.subj === subj && v.date >= today)
    .sort((a,b) => a.date > b.date ? 1 : -1)[0];
  const giorniVerifica = prossimaVer
    ? Math.ceil((new Date(prossimaVer.date) - new Date(today)) / 86400000)
    : null;

  // Compiti pendenti per questa materia
  const compitiPendenti = ST.compiti
    .filter(c => c.subj === subj && !c.done)
    .map(c => `"${c.titolo}" (scadenza: ${c.date})`)
    .slice(0, 4);

  // Sessioni di studio recenti (last 7 giorni)
  const last7 = [...Array(7)].map((_,i) => {
    const d = new Date(); d.setDate(d.getDate()-i);
    return d.toISOString().slice(0,10);
  });
  const sessioniSettimana = ST.rec
    .filter(r => r.date && last7.includes(r.date))
    .length;
  const minStudiatiSettimana = ST.rec
    .filter(r => r.date && last7.includes(r.date))
    .reduce((s,r) => s+(r.min||0), 0);

  // Appunti recenti per questa materia (solo titoli)
  const noteSubj = ST.notes
    .filter(n => n.subj === subj)
    .slice(-4)
    .map(n => `"${n.text ? n.text.slice(0,60) : n.day}"`)
    .reverse();

  // Componi il blocco contesto
  let ctx = `\n\n━━━ DATI REALI DELLO STUDENTE ━━━\nOggi: ${todayFmt}, ${fascia}.\n`;

  if (mediaSubj !== null) {
    ctx += `\nPERFORMANCE IN ${subj.toUpperCase()}:\n- Media attuale: ${mediaSubj}/10 su ${ST.voti.filter(v=>v.subj===subj).length} valutazioni`;
    if (votiSubj.length) ctx += `\n- Ultimi voti: ${votiSubj.join(' | ')}`;
  } else {
    ctx += `\nNessun voto registrato in ${subj} ancora.`;
  }

  if (prossimaVer) {
    const urgenza = giorniVerifica === 0 ? '⚠ OGGI!' : giorniVerifica === 1 ? '⚠ DOMANI!' : `tra ${giorniVerifica} giorni`;
    ctx += `\n\nPROSSIMA VERIFICA: ${prossimaVer.tipo==='i'?'Interrogazione':'Scritto'} di ${subj} — ${urgenza} (${prossimaVer.date})`;
  }

  if (compitiPendenti.length) {
    ctx += `\n\nCOMPITI PENDENTI (${subj}): ${compitiPendenti.join(' | ')}`;
  }

  ctx += `\n\nSTUDIO QUESTA SETTIMANA: ${sessioniSettimana} sessioni — ${minStudiatiSettimana} minuti totali`;

  if (noteSubj.length) {
    ctx += `\n\nULTIMI ARGOMENTI STUDIATI: ${noteSubj.join(' | ')}`;
  }

  ctx += `\n\nCOME USARE QUESTI DATI: Quando rilevante, fai riferimento esplicito ai dati sopra — non fingere di non sapere la situazione reale dello studente. Se c'è una verifica vicina, prioritizza il ripasso. Se la media è bassa, sii più esigente. Se ha studiato poco questa settimana, nominalo.\n━━━━━━━━━━━━━━━━━━━━━━━━━━━`;

  return ctx;
}

async function coachSend(){
  const input=document.getElementById('coach-input');
  const text=input?input.value.trim():'';
  if(!text||coachState.loading)return;
  input.value='';
  coachState.messages.push({role:'user',content:text});
  coachState.loading=true;
  renderCoach();
  try{
    const baseSystem = SUBJ_SYSTEM[coachState.subj] || 'Sei un coach scolastico esperto. Rispondi in italiano.';
    const contextBlock = buildCoachContext(coachState.subj);
    const system = baseSystem + contextBlock;
    const data=await geminiCall(system, coachState.messages.map(m=>({role:m.role,content:m.content})), 6144);
    const reply=data.content?.map(c=>c.text||'').join('')||'';
    coachState.messages.push({role:'assistant',content:reply});
  }catch(e){
    coachState.messages.push({role:'assistant',content:'// Errore di connessione — riprova.'});
  }
  coachState.loading=false;
  renderCoach();
}

const FC_KEY = 'polylife_flashcards_v1';

async function fcLoad(){
  if(window.db?.flashcards?.getAll){try{const c=await window.db.flashcards.getAll();if(c?.length)return c;}catch(_){}}
  try{return JSON.parse(localStorage.getItem(FC_KEY)||'[]')}catch{return []}
}
async function fcSave(arr){
  if(window.db?.flashcards?.saveAll){try{await window.db.flashcards.saveAll(arr);}catch(_){}}
  else if(window.db?.flashcards){for(const c of arr){try{await window.db.flashcards.save(c);}catch(_){}}}
  localStorage.setItem(FC_KEY, JSON.stringify(arr));
}

function fcLocalSM2(card, q){
  let ef = card.easiness_factor ?? 2.5;
  let interval = card.interval ?? 1;
  let reps = card.repetitions ?? 0;
  ef = Math.max(1.3, ef + 0.1 - (5-q)*(0.08+(5-q)*0.02));
  if(q>=3){ if(reps===0)interval=1; else if(reps===1)interval=6; else interval=Math.round(interval*ef); reps++; }
  else { reps=0; interval=1; }
  const d=new Date(); d.setDate(d.getDate()+interval);
  return {easiness_factor:Math.round(ef*1000)/1000, interval, repetitions:reps,
          next_review_date:d.toISOString().slice(0,10), last_reviewed:new Date().toISOString().slice(0,10)};
}

  return `<div class="know-overlay">
    <div class="know-header">
      <button class="ai-coach-close" onclick="knowState.phase='menu';renderKnow()">&#8592;</button>
      <div class="know-title">${modeLabels[knowState.mode]||'KNOW'}</div>
    </div>
    <div class="know-body">
      <div class="sec-label">Materia</div>
      <select id="know-subj" style="margin-bottom:12px" onchange="knowState.subj=this.value">
        ${ALL_SUBJS.map(s=>`<option value="${s}" ${s===knowState.subj?'selected':''}>${escH(s)}</option>`).join('')}
      </select>
      <div class="sec-label">Argomento / Testo</div>
      <textarea id="know-topic" style="min-height:120px;margin-bottom:12px" placeholder="Incolla il tuo testo, un argomento, o scrivi di cosa vuoi fare sessione...">${escH(knowState.topic)}</textarea>
      <button class="btn-main" style="margin:0" onclick="knowStart()">⚡ INIZIA SESSIONE</button>
      ${knowState.loading?`<div class="ai-loading" style="margin-top:1rem"><div class="ai-dot"></div><div class="ai-dot"></div><div class="ai-dot"></div><span>Generando contenuto AI...</span></div>`:''}
    </div>
  </div>`;
}

async function knowStart(){
  knowState.subj=document.getElementById('know-subj')?.value||knowState.subj||ALL_SUBJS[0];
  knowState.topic=document.getElementById('know-topic')?.value?.trim()||knowState.topic;
  if(!knowState.topic){alert('Inserisci un argomento o testo!');return;}
  knowState.loading=true;
  renderKnow();

  const mode=knowState.mode;
  let prompt='';
  if(mode==='flash'||mode==='quiz'){
    prompt=`Sei un professore universitario di ${knowState.subj} che prepara flashcard di studio avanzato. Basandoti su questo contenuto:\n\n"${knowState.topic}"\n\nCrea 6 flashcard di qualità elevata con questo mix obbligatorio:\n- 2 domande di DEFINIZIONE PRECISA con terminologia tecnica corretta\n- 2 domande di APPLICAZIONE o RAGIONAMENTO ("Perché...?", "Come si usa X in...?", "Cosa succede se...?")\n- 2 domande di COLLEGAMENTO ("Quale relazione c'è tra X e Y?", "Come si distingue X da Z?")\nLe risposte devono essere complete (3-5 righe), non monosillabiche. Usa terminologia accademica precisa.\nRispondi SOLO con questo JSON (no markdown, no testo fuori):\n{"cards":[{"domanda":"...","risposta":"..."},{"domanda":"...","risposta":"..."},{"domanda":"...","risposta":"..."},{"domanda":"...","risposta":"..."},{"domanda":"...","risposta":"..."},{"domanda":"...","risposta":"..."}]}`;
  }else if(mode==='open'){
    prompt=`Sei un professore universitario di ${knowState.subj} che conduce un'interrogazione orale approfondita. Basandoti su:\n\n"${knowState.topic}"\n\nCrea 4 domande aperte che richiedono ragionamento critico e articolazione concettuale. Le domande devono:\n- Richiedere più di una frase per rispondere\n- Testare comprensione profonda, non memorizzazione\n- Includere almeno una domanda di analisi causale ("Perché...", "Spiega come...") e una di valutazione o confronto\nPer ogni domanda fornisci una risposta modello esaustiva (5-8 righe) che uno studente preparato potrebbe dare.\nRispondi SOLO con questo JSON:\n{"cards":[{"domanda":"...","risposta":"..."},{"domanda":"...","risposta":"..."},{"domanda":"...","risposta":"..."},{"domanda":"...","risposta":"..."}]}`;
  }else if(mode==='schema'){
    prompt=`Sei un professore universitario di ${knowState.subj} esperto di sintesi concettuale. Basandoti su:\n\n"${knowState.topic}"\n\nCrea: 1) uno schema riassuntivo dettagliato che strutturi l'argomento con titoli, sottotitoli, relazioni causali e terminologia precisa (NON una lista piatta: usa gerarchia e connessioni logiche); 2) 4 domande chiave che coprono i nodi concettuali più importanti dell'argomento, con risposte articolate (4-6 righe ciascuna).\nRispondi SOLO con questo JSON:\n{"schema":"riassunto gerarchico con ### titoli, ## sottotitoli, **grassetto** per concetti chiave, e sezione finale // CONNESSIONI con altri argomenti","cards":[{"domanda":"...","risposta":"..."},{"domanda":"...","risposta":"..."},{"domanda":"...","risposta":"..."},{"domanda":"...","risposta":"..."}]}`;
  }

  try{
    const raw=await callAI(prompt, 4096);
    const parsed=JSON.parse(raw.replace(/```json|```/g,'').trim());
    knowState.cards=parsed.cards||[];
    knowState.schema=parsed.schema||null;
    knowState.idx=0; knowState.flipped=false; knowState.answers=[];
  }catch(e){
    knowState.cards=[{domanda:'Errore generazione — riprova',risposta:''}];
  }
  knowState.loading=false;
  knowState.phase='play';
  renderKnow();
}

function knowPlayHtml(){
  const {mode,cards,idx,flipped,answers,loading}=knowState;
  if(!cards.length)return'<div class="empty">// NESSUNA DOMANDA</div>';
  const card=cards[idx]||cards[0];
  const ans=answers[idx];
  const progress=`<div class="know-progress">${cards.map((_,i)=>{const a=answers[i];return`<div class="know-dot ${a?.ok===true?'ok':a?.ok===false?'no':a?.ok==='ai'?'ai':''}"></div>`}).join('')}</div>`;

  if(mode==='flash'){
    return `<div class="know-overlay">
      <div class="know-header">
        <button class="ai-coach-close" onclick="knowState.phase='menu';renderKnow()">✕</button>
        <div class="know-title">FLASHCARD</div>
        <span style="font-family:'Orbitron',monospace;font-size:10px;color:var(--text3)">${idx+1}/${cards.length}</span>
      </div>
      <div class="know-body">
        ${progress}
        <div class="know-quiz-card" style="cursor:pointer;border-top-color:${flipped?'var(--green)':'var(--purple)'}" onclick="knowFlip()">
          <div class="know-quiz-label">${flipped?'RISPOSTA':'DOMANDA'}</div>
          <div class="know-quiz-q">${escH(flipped?card.risposta:card.domanda)}</div>
          ${!flipped?'<div style="font-size:10px;color:var(--text3);font-family:\'Orbitron\',monospace">// tocca per girare</div>':''}
        </div>
        ${flipped?`<div class="know-btns">
          <button onclick="knowRate(false)" style="border-color:rgba(239,68,68,0.4);color:var(--red);background:rgba(239,68,68,0.06)">✕ NON SAPEVO</button>
          <button onclick="knowRate(true)"  style="border-color:rgba(16,185,129,0.4);color:var(--green);background:rgba(16,185,129,0.06)">✓ SAPEVO</button>
        </div>`:'<div class="know-btns"><button onclick="knowFlip()" class="btn-go">GIRA &#8594;</button></div>'}
        <div class="know-btns" style="margin-top:6px">
          <button onclick="knowPrev()">&#8592; PREC</button>
          <button onclick="knowNext()">SUCC &#8594;</button>
        </div>
      </div>
    </div>`;
  }

  if(mode==='quiz'||mode==='open'){
    const label=mode==='open'?'INTERROGAZIONE':'QUIZ AI';
    return `<div class="know-overlay">
      <div class="know-header">
        <button class="ai-coach-close" onclick="knowState.phase='menu';renderKnow()">✕</button>
        <div class="know-title">${label}</div>
        <span style="font-family:'Orbitron',monospace;font-size:10px;color:var(--text3)">${idx+1}/${cards.length}</span>
      </div>
      <div class="know-body">
        ${progress}
        <div class="know-quiz-card" style="border-top-color:var(--purple)">
          <div class="know-quiz-label">DOMANDA</div>
          <div class="know-quiz-q">${escH(card.domanda)}</div>
        </div>
        ${ans?`
          <div class="know-answer-box ${ans.ok===true?'ok':ans.ok===false?'no':'ai'}">
            <div style="font-family:'Orbitron',monospace;font-size:8px;letter-spacing:0.1em;margin-bottom:6px">${ans.ok===true?'✓ CORRETTO':ans.ok===false?'✕ MIGLIORABILE':'✦ VALUTAZIONE AI'}</div>
            ${ans.aiEval?md2html(ans.aiEval):`<div style="font-size:11px">Risposta corretta: ${escH(card.risposta)}</div>`}
          </div>
          <div class="know-btns">
            <button onclick="knowNext()" class="btn-go">PROSSIMA &#8594;</button>
          </div>
        `:`
          <textarea class="know-quiz-input" id="know-ans" placeholder="Scrivi la tua risposta..." style="min-height:80px"></textarea>
          <div class="know-btns">
            ${loading?`<button disabled style="opacity:.5">Valutando...</button>`:
              `<button onclick="knowSubmitAnswer()" class="btn-go">INVIA &#8594;</button>`}
            <button onclick="knowSkip()">SALTA</button>
          </div>
        `}
      </div>
    </div>`;
  }

  if(mode==='schema'){
    return `<div class="know-overlay">
      <div class="know-header">
        <button class="ai-coach-close" onclick="knowState.phase='menu';renderKnow()">✕</button>
        <div class="know-title">SCHEMA AI</div>
      </div>
      <div class="know-body">
        ${knowState.schema?`<div class="ai-coach-msg ai">${md2html(knowState.schema)}</div>`:''}
        <div class="sec-label">Domande di ripasso</div>
        ${cards.map((c,i)=>{
          const a=answers[i];
          return `<div class="metodo-card" style="cursor:pointer;${a?'opacity:.7':''}">
            <div class="metodo-card-title" onclick="knowToggleSchema(${i})">${i+1}. ${escH(c.domanda)}</div>
            <div id="know-schema-ans-${i}" style="display:none;font-size:12px;color:var(--text2);margin-top:6px;line-height:1.5">${escH(c.risposta)}</div>
          </div>`;
        }).join('')}
        <div class="know-btns" style="margin-top:1rem">
          <button onclick="knowState.phase='menu';renderKnow()">✕ CHIUDI</button>
          <button onclick="openKnowStudy()" class="btn-go">↺ NUOVA SESSIONE</button>
        </div>
      </div>
    </div>`;
  }
  return '';
}

function knowToggleSchema(i){
  const el=document.getElementById('know-schema-ans-'+i);
  if(el)el.style.display=el.style.display==='none'?'block':'none';
}

function knowFlip(){knowState.flipped=!knowState.flipped;renderKnow();}
function knowRate(ok){
  knowState.answers[knowState.idx]={ok,aiEval:null};
  knowState.flipped=false;
  if(knowState.idx<knowState.cards.length-1){knowState.idx++;renderKnow();}
  else{knowState.phase='result';renderKnow();}
}
function knowNext(){
  if(knowState.idx<knowState.cards.length-1){knowState.idx++;knowState.flipped=false;renderKnow();}
  else{knowState.phase='result';renderKnow();}
}
function knowPrev(){if(knowState.idx>0){knowState.idx--;knowState.flipped=false;renderKnow();}}
function knowSkip(){
  knowState.answers[knowState.idx]={ok:'ai',aiEval:'// saltata'};
  if(knowState.idx<knowState.cards.length-1){knowState.idx++;renderKnow();}
  else{knowState.phase='result';renderKnow();}
}

async function knowSubmitAnswer(){
  const ansEl=document.getElementById('know-ans');
  const userAns=ansEl?ansEl.value.trim():'';
  if(!userAns)return;
  const card=knowState.cards[knowState.idx];
  knowState.loading=true;
  renderKnow();
  const prompt=`Sei un professore universitario di ${knowState.subj} che valuta una risposta a un'interrogazione orale. La domanda era:\n"${card.domanda}"\n\nRisposta modello completa:\n"${card.risposta}"\n\nRisposta dello studente:\n"${userAns}"\n\nFai una valutazione strutturata in 3 parti:\n1. **GIUDIZIO** (inizia con ✓ Corretta / ≈ Parziale / ✕ Errata): valutazione sintetica in 1 riga\n2. **ANALISI DETTAGLIATA** (3-5 righe): cosa c'è di giusto, cosa manca, eventuali errori concettuali o terminologici — sii specifico, cita elementi della risposta dello studente\n3. **COME MIGLIORARE** (2-3 righe): indica esattamente cosa aggiungere o correggere, e suggerisci 1 collegamento concettuale che potrebbe arricchire la risposta\n\nTono: diretto, costruttivo, da professore esigente ma equo.`;
  try{
    const eval_=await callAI(prompt, 4096);
    const ok=eval_.startsWith('✓')?true:eval_.startsWith('✕')?false:'ai';
    knowState.answers[knowState.idx]={ok,aiEval:eval_};
  }catch{
    knowState.answers[knowState.idx]={ok:'ai',aiEval:'// Errore valutazione'};
  }
  knowState.loading=false;
  renderKnow();
}

function knowResultHtml(){
  const {answers,cards,mode}=knowState;
  const ok=answers.filter(a=>a.ok===true).length;
  const no=answers.filter(a=>a.ok===false).length;
  const pct=Math.round((ok/cards.length)*100);
  const msg=pct>=80?'OTTIMO!':pct>=50?'BUONO — RIPASSARE ANCORA':pct>=30?'DA RIVEDERE':'STUDIA DI PIÙ';
  const color=pct>=80?'var(--green)':pct>=50?'var(--gold)':'var(--red)';
  return `<div class="know-overlay">
    <div class="know-header">
      <button class="ai-coach-close" onclick="closeKnow()">✕</button>
      <div class="know-title">RISULTATO</div>
    </div>
    <div class="know-body">
      <div class="know-score-box">
        <div class="know-score-num" style="color:${color}">${pct}%</div>
        <div style="font-family:'Orbitron',monospace;font-size:11px;color:${color};letter-spacing:0.12em;margin-top:4px">${msg}</div>
        <div style="font-size:12px;color:var(--text2);margin-top:8px">${ok} corrette · ${no} errate · ${cards.length-ok-no} AI/skip</div>
      </div>
      <div class="sec-label">Riepilogo domande</div>
      ${cards.map((c,i)=>{
        const a=answers[i];
        const ic=a?.ok===true?'✓':a?.ok===false?'✕':'≈';
        const col=a?.ok===true?'var(--green)':a?.ok===false?'var(--red)':'var(--purple)';
        return `<div style="background:var(--bg2);border:1px solid var(--border);padding:.75rem 1rem;margin-bottom:6px">
          <div style="display:flex;gap:8px;align-items:flex-start">
            <span style="font-family:'Orbitron',monospace;font-size:14px;font-weight:900;color:${col};flex-shrink:0">${ic}</span>
            <div style="font-size:12px;color:var(--text2)">${escH(c.domanda)}</div>
          </div>
          ${a?.aiEval&&a.aiEval!=='// saltata'?`<div style="font-size:11px;color:var(--text3);margin-top:6px;border-top:1px solid var(--border);padding-top:6px">${md2html(a.aiEval)}</div>`:''}
        </div>`;
      }).join('')}
      <div class="know-btns" style="margin-top:1rem">
        <button onclick="openKnowStudy()">↺ NUOVA</button>
        <button onclick="openAiCoach('${escH(knowState.subj||ALL_SUBJS[0])}')">✦ COACH AI</button>
      </div>
    </div>
  </div>`;
}

// ── Recovery badge (external module) ──
// Count only sv4_rec items NOT yet present in polylife_recovery_v1
function updateRecBadge(){
  const nb = document.getElementById('nb-recovery');
  if(!nb) return;
  const sv4 = (function(){ try{return JSON.parse(localStorage.getItem('sv4_rec')||'[]')}catch{return []} })();
  const log  = (function(){ try{return JSON.parse(localStorage.getItem('polylife_recovery_v1')||'[]')}catch{return []} })();
  const logged = new Set(log.filter(e=>e.sourceId).map(e=>String(e.sourceId)));
  const n = sv4.filter(r=>!logged.has(String(r.id))).length;
  const badge = document.getElementById('rec-badge-ext');
  if(badge){ badge.textContent=n; badge.style.display=n>0?'flex':'none'; }
}
