<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polylife — Hub Calendario</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');

:root {
  --bg: #07090f; --surface: #0d1018; --surface2: #131720; --surface3: #1a1f2c;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.04);
  --blue: #3b82f6; --blue2: #60a5fa; --blue-dim: rgba(59,130,246,0.15);
  --purple: #8b5cf6; --purple2: #a78bfa;
  --teal: #14b8a6; --teal2: #2dd4bf;
  --amber: #f59e0b; --amber2: #fbbf24;
  --rose: #f43f5e; --rose2: #fb7185;
  --green: #22c55e; --green2: #4ade80;
  --text: #e2e8f0; --text2: #94a3b8; --muted: #475569;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Lora', Georgia, serif; min-height: 100vh; }

/* ── Layout ── */
.app { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }

/* ── Top bar ── */
.topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 16px 28px; display: flex; align-items: center; gap: 20px;
}
.topbar-logo {
  font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 800;
  letter-spacing: 3px; color: var(--text);
}
.topbar-logo span { color: var(--blue2); }

.topbar-date {
  font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text2);
  margin-left: auto;
}

.topbar-nav { display: flex; gap: 8px; }
.topbar-nav-btn {
  padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border);
  background: transparent; color: var(--text2); cursor: pointer; font-size: 12px;
  font-family: 'DM Mono', monospace; transition: all 0.15s;
}
.topbar-nav-btn:hover { border-color: var(--blue); color: var(--blue2); }
.topbar-nav-btn.active { background: var(--blue-dim); border-color: var(--blue); color: var(--blue2); }

/* ── Content ── */
.content { display: grid; grid-template-columns: 1fr 360px; gap: 0; }

/* ── Calendario principale ── */
.cal-panel { padding: 28px 28px 60px; }

.cal-header {
  display: flex; align-items: center; gap: 16px; margin-bottom: 28px;
}
.cal-month-title {
  font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800;
  color: var(--text); flex: 1;
}
.cal-nav-btn {
  width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--text2); cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center; transition: all 0.15s;
}
.cal-nav-btn:hover { border-color: var(--blue); color: var(--blue2); }
.today-btn {
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--text2); cursor: pointer;
  font-family: 'DM Mono', monospace; font-size: 11px; transition: all 0.15s;
}
.today-btn:hover { border-color: var(--blue); color: var(--blue2); }

/* Griglia calendario */
.cal-grid-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }

.cal-day-headers { display: grid; grid-template-columns: repeat(7,1fr); border-bottom: 1px solid var(--border); }
.cal-day-hdr {
  padding: 10px 0; text-align: center; font-family: 'DM Mono', monospace;
  font-size: 10px; color: var(--muted); letter-spacing: 1px;
}

.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); }

.cal-cell {
  border-right: 1px solid var(--border2); border-bottom: 1px solid var(--border2);
  min-height: 100px; padding: 8px; cursor: pointer; transition: background 0.15s;
  position: relative;
}
.cal-cell:nth-child(7n) { border-right: none; }
.cal-cell:hover { background: var(--surface2); }
.cal-cell.empty { background: rgba(0,0,0,0.2); cursor: default; }
.cal-cell.today { background: rgba(59,130,246,0.06); }
.cal-cell.today .cell-num { color: var(--blue2); background: var(--blue-dim); border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; }
.cal-cell.selected { background: rgba(59,130,246,0.1); outline: 2px solid rgba(59,130,246,0.4); outline-offset: -2px; }

.cell-num {
  font-family: 'DM Mono', monospace; font-size: 13px; color: var(--text2);
  margin-bottom: 6px; width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
}
.cell-num.other-month { color: var(--muted); }

/* Pillole eventi nella cella */
.cell-events { display: flex; flex-direction: column; gap: 2px; }
.cell-pill {
  font-size: 10px; padding: 2px 6px; border-radius: 3px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; font-family: 'DM Mono', monospace;
  cursor: pointer; transition: opacity 0.15s;
}
.cell-pill:hover { opacity: 0.8; }
.pill-verifica { background: rgba(244,63,94,0.2);  color: var(--rose2);  border-left: 2px solid var(--rose); }
.pill-mission  { background: rgba(139,92,246,0.2); color: var(--purple2);border-left: 2px solid var(--purple); }
.pill-studio   { background: rgba(59,130,246,0.2); color: var(--blue2);  border-left: 2px solid var(--blue); }
.pill-fitness  { background: rgba(20,184,166,0.2); color: var(--teal2);  border-left: 2px solid var(--teal); }
.cell-more {
  font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace;
  padding: 1px 6px;
}

/* ── Pannello laterale ── */
.side-panel {
  background: var(--surface); border-left: 1px solid var(--border);
  padding: 24px 20px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 24px;
}

.panel-date {
  font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700;
  color: var(--text); margin-bottom: 4px;
}
.panel-date-sub { font-size: 13px; color: var(--text2); font-style: italic; }

/* Sezione priorità nel pannello */
.panel-section { }
.panel-section-title {
  font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500;
  letter-spacing: 2px; color: var(--muted); text-transform: uppercase;
  margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
}
.panel-section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* Card evento nel pannello */
.event-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
  position: relative; overflow: hidden; transition: border-color 0.15s;
}
.event-card:hover { border-color: rgba(255,255,255,0.12); }
.event-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
.event-card.ev-verifica::before { background: var(--rose); }
.event-card.ev-mission-1::before { background: var(--rose); }
.event-card.ev-mission-2::before { background: var(--amber); }
.event-card.ev-mission-3::before { background: var(--green); }
.event-card.ev-studio::before { background: var(--blue); }
.event-card.ev-fitness::before { background: var(--teal); }

.event-type {
  font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 1px;
  text-transform: uppercase; margin-bottom: 4px; color: var(--text2);
}
.event-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
.event-meta  { font-size: 12px; color: var(--text2); font-style: italic; }
.event-badge {
  font-family: 'DM Mono', monospace; font-size: 9px; padding: 2px 6px;
  border-radius: 3px; margin-top: 6px; display: inline-block;
}
.badge-urgente { background: rgba(244,63,94,0.2); color: var(--rose2); }
.badge-xp      { background: rgba(139,92,246,0.15); color: var(--purple2); }
.badge-sogg    { background: rgba(59,130,246,0.15); color: var(--blue2); }

.completed-check {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  font-size: 16px; color: var(--green2);
}

/* Panel empty */
.panel-empty { text-align: center; padding: 32px 16px; color: var(--muted); font-style: italic; font-size: 14px; }

/* Score bar giorno */
.day-score-bar { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.score-title { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 1px; margin-bottom: 10px; }
.score-grid  { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.score-item  { text-align: center; }
.score-val   { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 700; color: var(--text); }
.score-lbl   { font-size: 11px; color: var(--muted); margin-top: 2px; }
.score-item.red  .score-val { color: var(--rose2); }
.score-item.gold .score-val { color: var(--amber2); }
.score-item.blue .score-val { color: var(--blue2); }
.score-item.green.score-val { color: var(--green2); }
</style>
</head>
<body>
<div class="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <button onclick="window.location.href='/polymath_os_v9.html'" style="font-family:monospace;font-size:11px;background:transparent;border:1px solid rgba(79,140,255,0.3);color:#4f8cff;padding:5px 12px;cursor:pointer;letter-spacing:0.1em;margin-right:12px">← HUB</button>
    <div class="topbar-logo">POLY<span>LIFE</span> HUB</div>
    <div class="topbar-nav">
      <button class="topbar-nav-btn active" onclick="switchView('month')">Mese</button>
      <button class="topbar-nav-btn" onclick="switchView('week')">Settimana</button>
    </div>
    <div class="topbar-date" id="topbar-date"></div>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <!-- CALENDARIO -->
    <div class="cal-panel">
      <div class="cal-header">
        <div class="cal-month-title" id="cal-month-title">—</div>
        <button class="today-btn" onclick="goToday()">Oggi</button>
        <button class="cal-nav-btn" onclick="navMonth(-1)">‹</button>
        <button class="cal-nav-btn" onclick="navMonth(1)">›</button>
      </div>

      <div class="cal-grid-wrap">
        <div class="cal-day-headers">
          <div class="cal-day-hdr">LUN</div><div class="cal-day-hdr">MAR</div>
          <div class="cal-day-hdr">MER</div><div class="cal-day-hdr">GIO</div>
          <div class="cal-day-hdr">VEN</div><div class="cal-day-hdr">SAB</div>
          <div class="cal-day-hdr">DOM</div>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
    </div>

    <!-- PANNELLO LATERALE -->
    <div class="side-panel" id="side-panel">
      <div>
        <div class="panel-date" id="panel-date">—</div>
        <div class="panel-date-sub" id="panel-date-sub">Seleziona un giorno</div>
      </div>
      <div id="panel-content">
        <div class="panel-empty">Clicca su un giorno per vedere i dettagli</div>
      </div>
    </div>
  </div>
</div>

<script>
// ── Stato ──────────────────────────────────────────────────────────────────────
let calYear, calMonth;
let selectedDate = todayStr();
let allEvents = []; // { date, type, title, meta, priority, xp, completed, color }

function todayStr() { return new Date().toISOString().slice(0,10); }
function fmtDate(s) {
  const d = new Date(s + 'T12:00:00');
  return d.toLocaleDateString('it-IT', { weekday:'long', day:'numeric', month:'long' });
}
function fmtShort(s) {
  const d = new Date(s + 'T12:00:00');
  return d.toLocaleDateString('it-IT', { day:'numeric', month:'short' });
}

// ── Carica dati da tutti i moduli ─────────────────────────────────────────────
async function loadAllEvents() {
  allEvents = [];

  // 1. Verifiche studio (da DB o localStorage)
  try {
    let verifiche = [];
    if (window.db && window.db.studio) {
      verifiche = await window.db.studio.getVerifiche();
    } else {
      verifiche = JSON.parse(localStorage.getItem('sv4_ver') || '[]');
    }
    verifiche.forEach(v => {
      allEvents.push({
        date: v.date, type: 'verifica', priority: 1,
        title: `${v.subject || 'Verifica'}`,
        meta: v.tipo || '', completed: v.completata == 1, color: 'rose'
      });
    });
  } catch(_) {}

  // 2. Missioni giornaliere (da DB o localStorage)
  try {
    let missions = [];
    if (window.db && window.db.dailyMissions) {
      missions = await window.db.dailyMissions.getRange('2020-01-01','2099-12-31');
    } else {
      missions = JSON.parse(localStorage.getItem('polylife_daily_missions_v1') || '[]');
    }
    missions.forEach(m => {
      allEvents.push({
        date: m.date, type: 'mission', priority: +(m.priority||2),
        title: m.title, meta: m.category, xp: m.xp,
        completed: m.completed==1||m.completed===true, color: 'purple'
      });
    });
  } catch(_) {}

  // 3. Sessioni studio (ultime 60gg — solo per mostrare attività)
  try {
    let sessions = [];
    const from = new Date(); from.setDate(from.getDate()-60);
    const fromStr = from.toISOString().slice(0,10);
    if (window.db && window.db.studio) {
      sessions = await window.db.studio.getSessions(fromStr, '2099-12-31');
    } else {
      sessions = (JSON.parse(localStorage.getItem('sv4_rec')||'[]'))
        .filter(s => s.date >= fromStr);
    }
    // Aggrega per giorno
    const byDay = {};
    sessions.forEach(s => {
      if (!byDay[s.date]) byDay[s.date] = { min:0, xp:0 };
      byDay[s.date].min += (s.duration||0);
      byDay[s.date].xp  += (s.xp||0);
    });
    Object.entries(byDay).forEach(([date, d]) => {
      if (d.min > 0) allEvents.push({
        date, type: 'studio', priority: 3,
        title: `Studio ${d.min}min`, meta: `+${d.xp} XP`,
        completed: true, color: 'blue'
      });
    });
  } catch(_) {}

  // 4. Check-in LEO (ultime 30gg)
  try {
    let checkins = [];
    const from30 = new Date(); from30.setDate(from30.getDate()-30);
    const from30Str = from30.toISOString().slice(0,10);
    if (window.db && window.db.leo) {
      checkins = await window.db.leo.getCheckins(from30Str, '2099-12-31');
    } else {
      checkins = JSON.parse(localStorage.getItem('leo_checkin')||'[]')
        .filter(c => c.date >= from30Str);
    }
    checkins.forEach(c => {
      allEvents.push({
        date: c.date, type: 'fitness', priority: 3,
        title: 'Check-in LEO', meta: c.weight ? `${c.weight}kg` : '',
        completed: true, color: 'teal'
      });
    });
  } catch(_) {}

  renderCalendar();
  renderSidePanel(selectedDate);
}

// ── Calendario ─────────────────────────────────────────────────────────────────
function renderCalendar() {
  const today = todayStr();
  const firstDow = new Date(calYear, calMonth, 1).getDay(); // 0=dom
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const prevMonthDays = new Date(calYear, calMonth, 0).getDate();

  const MONTHS = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
                  'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  document.getElementById('cal-month-title').textContent = `${MONTHS[calMonth]} ${calYear}`;

  // Mappa eventi per data
  const evByDate = {};
  allEvents.forEach(ev => {
    if (!evByDate[ev.date]) evByDate[ev.date] = [];
    evByDate[ev.date].push(ev);
  });

  let html = '';
  let off = (firstDow + 6) % 7; // lunedì = 0

  // Giorni del mese precedente
  for (let i = 0; i < off; i++) {
    const d = prevMonthDays - off + 1 + i;
    html += `<div class="cal-cell empty"><div class="cell-num other-month">${d}</div></div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday    = dateStr === today;
    const isSelected = dateStr === selectedDate;
    const dayEvents  = evByDate[dateStr] || [];

    // Ordina: priority 1 prima, poi tipo verifica, poi altri
    const sorted = [...dayEvents].sort((a,b) => (a.priority||3)-(b.priority||3));

    // Pill da mostrare (max 3)
    const shown = sorted.slice(0,3);
    const extra = sorted.length - shown.length;

    const cls = ['cal-cell', isToday?'today':'', isSelected?'selected':''].filter(Boolean).join(' ');

    const pills = shown.map(ev => {
      const pillClass = ev.type === 'verifica' ? 'pill-verifica'
                      : ev.type === 'mission'  ? 'pill-mission'
                      : ev.type === 'studio'   ? 'pill-studio'
                      : 'pill-fitness';
      const prefix = ev.type === 'verifica' ? '📝 '
                   : ev.type === 'mission'  ? '⚔ '
                   : ev.type === 'studio'   ? '📚 '
                   : '🏋 ';
      return `<div class="cell-pill ${pillClass}" title="${ev.title}">${prefix}${ev.title.slice(0,18)}</div>`;
    }).join('');

    html += `
      <div class="${cls}" onclick="selectDay('${dateStr}')">
        <div class="cell-num${isToday ? '' : ''}">${d}</div>
        <div class="cell-events">
          ${pills}
          ${extra > 0 ? `<div class="cell-more">+${extra} altro</div>` : ''}
        </div>
      </div>`;
  }

  document.getElementById('cal-grid').innerHTML = html;
}

// ── Pannello laterale ─────────────────────────────────────────────────────────
function renderSidePanel(date) {
  const today = todayStr();
  const dayEvs = allEvents.filter(e => e.date === date);

  document.getElementById('panel-date').textContent     = fmtDate(date);
  document.getElementById('panel-date-sub').textContent =
    date === today ? 'Oggi' :
    date < today   ? 'Passato' : 'Futuro';

  const urgent   = dayEvs.filter(e => e.priority === 1 || e.type === 'verifica');
  const normale  = dayEvs.filter(e => e.priority === 2 && e.type !== 'verifica');
  const resto    = dayEvs.filter(e => e.priority >= 3 && e.type !== 'verifica');

  // Score box
  const verifiche = dayEvs.filter(e => e.type==='verifica').length;
  const missions  = dayEvs.filter(e => e.type==='mission').length;
  const doneMiss  = dayEvs.filter(e => e.type==='mission' && e.completed).length;
  const xpTot     = dayEvs.filter(e => e.completed).reduce((s,e)=>s+(e.xp||0),0);

  let html = '';

  if (verifiche || missions) {
    html += `
      <div class="day-score-bar">
        <div class="score-title">SOMMARIO GIORNO</div>
        <div class="score-grid">
          ${verifiche ? `<div class="score-item red"><div class="score-val">${verifiche}</div><div class="score-lbl">Verifiche</div></div>` : ''}
          ${missions  ? `<div class="score-item gold"><div class="score-val">${doneMiss}/${missions}</div><div class="score-lbl">Missioni</div></div>` : ''}
          ${xpTot     ? `<div class="score-item blue"><div class="score-val">+${xpTot}</div><div class="score-lbl">XP</div></div>` : ''}
        </div>
      </div>`;
  }

  if (urgent.length) {
    html += `<div class="panel-section">
      <div class="panel-section-title">🔴 Priorità alta</div>
      ${urgent.map(evCard).join('')}
    </div>`;
  }
  if (normale.length) {
    html += `<div class="panel-section">
      <div class="panel-section-title">🟡 Normale</div>
      ${normale.map(evCard).join('')}
    </div>`;
  }
  if (resto.length) {
    html += `<div class="panel-section">
      <div class="panel-section-title">📋 Attività</div>
      ${resto.map(evCard).join('')}
    </div>`;
  }

  if (!dayEvs.length) {
    html = `<div class="panel-empty">Nessuna attività per questo giorno.</div>`;
  }

  document.getElementById('panel-content').innerHTML = html;
}

function evCard(ev) {
  const typeLabels = { verifica:'📝 VERIFICA', mission:'⚔ MISSIONE', studio:'📚 STUDIO', fitness:'🏋️ FITNESS' };
  const cls = ev.type === 'verifica' ? 'ev-verifica'
            : ev.type === 'mission'  ? `ev-mission-${ev.priority||2}`
            : ev.type === 'studio'   ? 'ev-studio'
            : 'ev-fitness';
  return `
    <div class="event-card ${cls}">
      <div class="event-type">${typeLabels[ev.type]||ev.type.toUpperCase()}</div>
      <div class="event-title">${escHtml(ev.title)}</div>
      ${ev.meta ? `<div class="event-meta">${escHtml(ev.meta)}</div>` : ''}
      ${ev.type==='verifica' ? `<span class="event-badge badge-urgente">⚠ Preparati!</span>` : ''}
      ${ev.xp ? `<span class="event-badge badge-xp">+${ev.xp} XP</span>` : ''}
      ${ev.completed ? `<div class="completed-check">✓</div>` : ''}
    </div>`;
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function selectDay(date) {
  selectedDate = date;
  renderCalendar();
  renderSidePanel(date);
}

function navMonth(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0)  { calMonth = 11; calYear--; }
  renderCalendar();
}

function goToday() {
  const now = new Date();
  calYear = now.getFullYear(); calMonth = now.getMonth();
  selectedDate = todayStr();
  renderCalendar(); renderSidePanel(selectedDate);
}

function switchView(v) {
  document.querySelectorAll('.topbar-nav-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  // Vista settimana — future implementation
}

// ── Init ──────────────────────────────────────────────────────────────────────
function init() {
  const now = new Date();
  calYear = now.getFullYear(); calMonth = now.getMonth();
  selectedDate = todayStr();

  // Data in topbar
  document.getElementById('topbar-date').textContent =
    new Date().toLocaleDateString('it-IT', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  loadAllEvents();
  // Aggiorna ogni 2 min se aperto
  setInterval(loadAllEvents, 2 * 60 * 1000);
}

init();
</script>
